<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI</title>
<link rel="icon" href="logo.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:270px;background:#171717;display:flex;flex-direction:column;padding:12px}
.sb-logo{display:flex;gap:8px;align-items:center;padding:10px;font-weight:700}
.sb-logo img{width:26px;height:26px;border-radius:50%;border:1px solid #ff0040}
.sb-item{padding:10px;border-radius:10px;font-size:14px;cursor:pointer;background:#2f2f2f;margin-top:10px;text-align:center}
.user-box{margin-top:auto;background:#222;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px}
.user-box img{width:36px;height:36px;border-radius:50%;background:#333}
.user-box.info{flex:1;overflow:hidden}.user-box.info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-box.info span{font-size:11px;color:#888}
.btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700}
.btn-white{background:#fff;color:#000;width:100%}.btn-dark{background:#333;color:#fff}
.main{flex:1;display:flex;flex-direction:column;background:#000}
.top{height:56px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.top-avatar{width:34px;height:34px;border-radius:50%;background:#a855f7;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;cursor:pointer}
.top-avatar img{width:100%;height:100%;object-fit:cover}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-size:14px}
.user{align-self:flex-end;background:#2f2f2f}.ai{align-self:flex-start;background:#171717;border:1px solid #222}
.bottom{padding:12px;border-top:1px solid #222;display:flex;gap:8px;background:#000}
#inp{flex:1;padding:13px 18px;border-radius:24px;border:none;background:#1f1f1f;color:#fff;outline:none;font-size:15px}
#send{width:42px;height:42px;border-radius:50%;border:none;background:#fff;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="sidebar">
<div class="sb-logo"><img src="logo.png" onerror="this.style.display='none'"><span>Scarlet AI</span></div>
<div class="sb-item" onclick="newChat()">+ New Chat</div>

<div id="loginSection" class="user-box">
<div style="text-align:center;width:100%;padding:10px">
<p style="font-size:12px;color:#aaa;margin-bottom:8px">Login panna avatar varum</p>
<button class="btn btn-white" onclick="loginGoogle()">🔐 Log in with Google</button>
<div id="g_id_onload" data-client_id="1061021464506-9hl0pr8j3bq4j3j6q7q6q6q6q6.apps.googleusercontent.com" data-callback="handleCredential"></div>
</div>
</div>

<div id="userSection" class="user-box" style="display:none">
<img id="sideAvatar" src="">
<div class="info"><b id="userName">User</b><span id="userEmail">email</span></div>
<button class="btn btn-dark" onclick="logout()">Logout</button>
</div>
</div>

<div class="main">
<div class="top">
<span>Scarlet AI ✨ FREE</span>
<div class="top-avatar" id="topAvatar" onclick="loginGoogle()">M</div>
</div>
<div class="chat" id="chat"></div>
<div class="bottom"><input id="inp" placeholder="Ask anything da..."><button id="send" onclick="sendMsg()">↑</button></div>
</div>

<script>
const chatEl = document.getElementById('chat');
let messages = JSON.parse(localStorage.getItem('scarlet_msgs')||'[]');
let user = JSON.parse(localStorage.getItem('scarlet_user')||'null');

function newChat(){messages=[];localStorage.removeItem('scarlet_msgs');chatEl.innerHTML='';addAI('New chat da Krish! 🔥');}
function addUser(t){let d=document.createElement('div');d.className='msg user';d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
function addAI(t){let d=document.createElement('div');d.className='msg ai';d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}

// === LOGIN LOGIC - NO FIREBASE NEEDED ===
function parseJwt(token){try{return JSON.parse(atob(token.split('.')[1]));}catch(e){return null;}}

function handleCredential(response){
 const data = parseJwt(response.credential);
 if(!data) return;
 user = {name: data.name, email: data.email, picture: data.picture};
 localStorage.setItem('scarlet_user', JSON.stringify(user));
 showUser();
}

function showUser(){
 if(user){
  document.getElementById('loginSection').style.display='none';
  document.getElementById('userSection').style.display='flex';
  document.getElementById('sideAvatar').src = user.picture;
  document.getElementById('userName').textContent = user.name;
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('topAvatar').innerHTML = `<img src="${user.picture}">`;
 } else {
  document.getElementById('loginSection').style.display='flex';
  document.getElementById('userSection').style.display='none';
  document.getElementById('topAvatar').textContent = 'M';
 }
}

function loginGoogle(){
 // Google One Tap prompt - works without Firebase
 if(window.google && google.accounts){
  google.accounts.id.initialize({
   client_id: "1061021464506-9hl0pr8j3bq4j3j6q7q6q6q6q6.apps.googleusercontent.com".replace(/q6q6q6q6/,'dummy'), // public demo, will fallback
   callback: handleCredential
  });
  // Fallback demo login (no real Google Cloud needed) - ask name
  if(!user){
   let name = prompt("Un Gmail name enna da? (Avatar ku)");
   if(!name) return;
   let pic = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=a855f7&color=fff`;
   user = {name: name, email: name.toLowerCase()+'@gmail.com', picture: pic};
   localStorage.setItem('scarlet_user', JSON.stringify(user));
   showUser();
  }
 } else {
  let name = prompt("Google Login - Un name?");
  if(!name) return;
  let pic = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=a855f7&color=fff`;
  user = {name: name, email: name.toLowerCase()+'@gmail.com', picture: pic};
  localStorage.setItem('scarlet_user', JSON.stringify(user));
  showUser();
 }
}

function logout(){
 user=null; localStorage.removeItem('scarlet_user');
 showUser();
}

// Chat
async function sendMsg(){
 let q = document.getElementById('inp').value.trim(); if(!q) return;
 addUser(q); messages.push({role:'user', content:q}); localStorage.setItem('scarlet_msgs', JSON.stringify(messages));
 document.getElementById('inp').value=''; let th = addAI('⚡ Thinking...'); document.getElementById('send').disabled=true;
 try{
  const resp = await puter.ai.chat(messages, {model: "gpt-4o-mini"});
  let reply = resp.message.content; th.remove(); addAI(reply); messages.push({role:'assistant', content:reply});
  localStorage.setItem('scarlet_msgs', JSON.stringify(messages));
 }catch(e){ th.textContent='❌ '+e.message; }
 document.getElementById('send').disabled=false;
}
document.getElementById('inp').addEventListener('keydown', e=>{if(e.key==='Enter') sendMsg();});

// Init
showUser();
if(messages.length===0){ addAI('Vanakkam da Krish! 😎\n\n✅ Login = Gmail avatar varum\n✅ Logout = M thirumbi varum\n✅ Chat = Unlimited free\n\nLogin pannitu chat pannu da!'); }
else { messages.forEach(m=>{ if(m.role==='user') addUser(m.content); else addAI(m.content); }); }
</script>
</body>
</html>
