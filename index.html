<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo-img{width:40px;height:40px;border-radius:50%;border:2px solid #ff0040}
.login-btn{background:#fff;color:#000;border:0;padding:8px 18px;border-radius:20px;font-weight:800;cursor:pointer}
.credit{font-size:12px;color:#aaa;border:1px solid #333;padding:5px 10px;border-radius:20px}
.main{max-width:700px;margin:0 auto;padding:16px}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:18px;margin-top:18px}
textarea{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;color:#fff;outline:none;resize:none}
.gen-btn{width:100%;margin-top:12px;background:linear-gradient(135deg,#ff0040,#ff6a00);border:0;padding:14px;border-radius:12px;color:#fff;font-weight:800;cursor:pointer;font-size:16px}
#result img{width:100%;border-radius:12px;margin-top:14px}
</style>
</head>
<body>
<header>
<div class="logo"><img src="logo.png" class="logo-img"> Scarlet AI</div>
<div style="display:flex;gap:10px;align-items:center">
<div class="credit" id="credit">6/6</div>
<button class="login-btn" id="loginBtn">Login</button>
<span id="userInfo" style="display:none"></span>
</div>
</header>
<div class="main">
<div class="card">
<h3>✨ Create Image</h3>
<textarea id="prompt" rows="4" placeholder="A cyberpunk girl in neon city..."></textarea>
<button class="gen-btn" id="genBtn">Generate (1 Credit)</button>
<div id="result"></div>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAJagbPj--jTLcYeTE-PDOWc9tuhXCl6PdE",
  authDomain: "scarlet-ai-fa68c.firebaseapp.com",
  projectId: "scarlet-ai-fa68c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// GET REDIRECT RESULT FIRST
auth.getRedirectResult().then((result)=>{
  if(result && result.user){
    alert("SUCCESS DA HARI! Welcome "+result.user.displayName+" 🔥");
  }
}).catch((e)=>{
  alert("Redirect Result Error: "+e.code+"\n"+e.message);
});

// LOGIN WITH DEBUG ALERTS
document.getElementById('loginBtn').onclick = async ()=>{
  const btn = document.getElementById('loginBtn');
  try{
    alert("Step 1: Firebase Ready...");
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt: 'select_account'});
    
    await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    alert("Step 2: Persistence OK - Redirecting NOW!");
    
    btn.innerText = "Opening Google...";
    await auth.signInWithRedirect(provider);
    
  }catch(e){
    alert("FIREBASE ERROR:\nCode: "+e.code+"\nMessage: "+e.message+"\n\nScreenshot eduthu anuppu da!");
    btn.innerText = "Login";
  }
};

// Auth state
auth.onAuthStateChanged((user)=>{
  if(user){
    document.getElementById('loginBtn').style.display='none';
    const u = document.getElementById('userInfo');
    u.style.display='block';
    u.innerHTML = `👤 ${user.displayName.split(' ')[0]} <button onclick="firebase.auth().signOut().then(()=>location.reload())" style="margin-left:8px;padding:5px 12px;border-radius:12px;background:#222;color:#fff;border:1px solid #444">Logout</button>`;
  }
});

// Generate
function getCredits(){
  const k='img_use_'+new Date().toDateString();
  let u=parseInt(localStorage.getItem(k)||"0"); if(isNaN(u)) u=0;
  document.getElementById('credit').innerText=`${6-u}/6`;
  return {u,k};
}
getCredits();
document.getElementById('genBtn').onclick=()=>{
  const p=document.getElementById('prompt').value.trim();
  if(!p) return alert("Prompt type pannu da!");
  let {u,k}=getCredits(); if(u>=6) return alert("Daily over da!");
  const b=document.getElementById('genBtn'); b.disabled=true; b.innerText="Generating... 🔥";
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?seed=${Math.floor(Math.random()*99999)}&nologo=true&width=768&height=768`;
  document.getElementById('result').innerHTML=`<img src="${url}" onload="document.getElementById('genBtn').disabled=false;document.getElementById('genBtn').innerText='Generate (1 Credit)'; " onerror="document.getElementById('genBtn').disabled=false; document.getElementById('genBtn').innerText='Generate (1 Credit)';">`;
  localStorage.setItem(k,String(u+1)); getCredits();
};
</script>
</body>
</html>
