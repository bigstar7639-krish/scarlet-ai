<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scarlet AI - OEV-1</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center}
.header{padding:30px;background:linear-gradient(135deg,#ff0040,#ff6600)}
.logo{width:80px;border-radius:50%}
.card{border:1px solid #333;margin:15px;padding:20px;border-radius:15px;background:#111}
.btn{background:#ff0040;color:#fff;padding:12px 25px;border:none;border-radius:25px;font-size:16px}
input{padding:12px;width:70%;background:#222;color:#fff;border:1px solid #333;border-radius:10px}
#chat{height:300px;overflow-y:auto;text-align:left;padding:10px;background:#0a0a0a;margin:10px;border-radius:10px}
</style>
</head>
<body>
<div class="header">
<img src="logo.png" class="logo">
<h1>SCARLET AI</h1>
<h3>OEV-1 | 4 in 1 | NO API KEY NEEDED 🔥</h3>
<p>✅ Production Live - 1 minute ago</p>
</div>

<div class="card">
<h3>💬 Scarlet Chat</h3>
<div id="chat"><div><b>Scarlet:</b> Hey da Moco! No Groq, No Error! Full free mode da! Enna help venum?</div></div>
<input id="msg" placeholder="Type da...">
<button class="btn" onclick="send()">Send</button>
</div>

<div class="card">
<h3>🚀 Status</h3>
<p>✅ API Removed</p>
<p>✅ Groq Removed</p>
<p>✅ 100% Working</p>
<p>✅ Vercel Production Live</p>
</div>

<script>
function send(){
let m=document.getElementById('msg').value;
if(!m) return;
let c=document.getElementById('chat');
c.innerHTML+=`<div style="margin:8px 0;color:#0f8"><b>You:</b> ${m}</div>`;
c.innerHTML+=`<div style="margin:8px 0"><b>Scarlet:</b> Semma da! "${m}" - Scarlet AI ippo NO-AI super fast mode la irukku da! 🔥</div>`;
document.getElementById('msg').value='';
c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
