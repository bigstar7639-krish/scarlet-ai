<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI - FREE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#212121;color:#ececec;height:100vh;display:flex;flex-direction:column}
#top{padding:14px 20px;border-bottom:1px solid #333;font-weight:700}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#2f2f2f}
.ai{align-self:flex-start;background:#171717;border:1px solid #333}
#bottom{padding:12px;border-top:1px solid #333;display:flex;gap:8px}
#inp{flex:1;padding:12px 16px;border-radius:24px;border:none;background:#2f2f2f;color:#fff;outline:none}
#send{width:42px;height:42px;border-radius:50%;border:none;background:#fff;cursor:pointer}
#keyScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
#keyScreen.hide{display:none}
.card{background:#2f2f2f;padding:24px;border-radius:16px;width:100%;max-width:380px;text-align:center}
.card input{width:100%;padding:12px;margin:12px 0;border-radius:8px;border:none;background:#171717;color:#fff}
.card button{width:100%;padding:12px;border-radius:8px;border:none;background:#fff;color:#000;font-weight:700}
</style>
</head>
<body>
<div id="keyScreen"><div class="card"><h3>✨ Scarlet AI - FREE</h3><p style="font-size:13px;color:#aaa;margin-top:6px">Google Gemini FREE Key (AIza...). aistudio.google.com/app/apikey</p><input id="keyInput" type="password" placeholder="AIza..."><button onclick="saveKey()">Save & Start FREE Chat</button></div></div>
<div id="top">Scarlet AI ✨ FREE</div>
<div id="chat"><div class="msg ai">✅ FREE mode ON da Krish! Hi sollu da!</div></div>
<div id="bottom"><input id="inp" placeholder="Message Scarlet..."><button id="send" onclick="send()">↑</button></div>
<script>
let apiKey=localStorage.getItem('gemini_key')||'';
let history=[];
const keyScreen=document.getElementById('keyScreen');
if(apiKey) keyScreen.classList.add('hide');
function saveKey(){let k=document.getElementById('keyInput').value.trim();if(!k.startsWith('AIza')){alert('Valid Gemini key (AIza...) podu');return;}localStorage.setItem('gemini_key',k);apiKey=k;keyScreen.classList.add('hide');}
function addMsg(t,cls){let c=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+cls;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}
async function send(){let q=document.getElementById('inp').value.trim();if(!q)return;if(!apiKey){keyScreen.classList.remove('hide');return;}addMsg(q,'user');history.push({role:'user',parts:[{text:q}]});document.getElementById('inp').value='';let thinking=addMsg('⚡ Thinking...','ai');let btn=document.getElementById('send');btn.disabled=true;
try{let res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:history,generationConfig:{temperature:0.7}})});let data=await res.json();if(data.error) throw new Error(data.error.message);thinking.remove();let reply=data.candidates[0].content.parts[0].text;addMsg(reply,'ai');history.push({role:'model',parts:[{text:reply}]});}catch(e){thinking.textContent='❌ '+e.message;}btn.disabled=false;}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
