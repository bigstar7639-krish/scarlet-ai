<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI - AI Image Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#ff0040,#ff6a00);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.credit{font-size:13px;color:#aaa;border:1px solid #333;padding:6px 12px;border-radius:20px}
.login-btn{background:#fff;color:#000;border:0;padding:8px 16px;border-radius:20px;font-weight:600;cursor:pointer}
#userInfo{display:none;font-size:14px}
.main{max-width:700px;margin:0 auto;padding:20px}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:20px;margin-top:20px}
textarea{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;resize:none;font-size:15px;outline:none}
textarea:focus{border-color:#ff0040}
.gen-btn{width:100%;margin-top:16px;background:linear-gradient(135deg,#ff0040,#ff6a00);border:0;padding:14px;border-radius:12px;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.gen-btn:disabled{opacity:0.5}
#result{margin-top:20px}
#result img{width:100%;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<header>
<div class="logo"><div class="logo-icon">S</div>Scarlet AI</div>
<div style="display:flex;gap:12px;align-items:center">
<div class="credit" id="credit">6/6 Credits</div>
<button class="login-btn" id="loginBtn" onclick="loginWithGoogle()">Login</button>
<div id="userInfo"></div>
</div>
</header>

<div class="main">
<div class="card">
<h3 style="margin-bottom:12px">✨ Create Image</h3>
<textarea id="prompt" rows="4" placeholder="A cyberpunk girl in neon city, ultra detailed..."></textarea>
<button class="gen-btn" id="genBtn" onclick="generate()">Generate (1 Credit)</button>
<div id="result"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJagbPj--jTLcYeTE-PDOWc9tuhXCl6PdE",
  authDomain: "scarlet-ai-fa68c.firebaseapp.com",
  projectId: "scarlet-ai-fa68c",
  storageBucket: "scarlet-ai-fa68c.firebasestorage.app",
  messagingSenderId: "145131745721",
  appId: "1:145131745721:web:dfa412973efb2f37c3c668"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

getRedirectResult(auth).then((r)=>{
  if(r?.user){ console.log("Login OK", r.user.displayName); }
}).catch(e=>console.log(e));

window.loginWithGoogle = () => {
  signInWithRedirect(auth, provider);
};

window.logout = async () => {
  await signOut(auth);
  location.reload();
};

onAuthStateChanged(auth, (user) => {
  if(user){
    document.getElementById('loginBtn').style.display='none';
    const i=document.getElementById('userInfo');
    i.style.display='block';
    i.innerHTML=`👤 ${user.displayName.split(' ')[0]} <button onclick="logout()" style="margin-left:8px;padding:4px 10px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;cursor:pointer;">Logout</button>`;
  }
});

// Credits logic - Fix 0/6 bug
function getCredits(){
  const d=new Date().toDateString();
  const key='img_use_'+d;
  let used = parseInt(localStorage.getItem(key) || "0");
  // old bug fix - if more than 6 or invalid, reset
  if(isNaN(used) || used>6){ used=0; localStorage.setItem(key,"0"); }
  document.getElementById('credit').innerText = `${6-used}/6 Credits`;
  return {used, key};
}
getCredits();

window.generate = async () => {
  const p=document.getElementById('prompt').value.trim();
  if(!p) return alert("Prompt type pannu da!");
  let {used, key} = getCredits();
  if(used>=6) return alert("Daily 6 credits over da! Tomorrow va!");
  
  const btn=document.getElementById('genBtn');
  btn.disabled=true; btn.innerText="Generating... 🔥";
  
  try{
    // Pollinations free API - no key needed
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=1024&seed=${Math.floor(Math.random()*9999)}&nologo=true`;
    const resDiv=document.getElementById('result');
    resDiv.innerHTML=`<p style="color:#aaa;font-size:14px">Generating...</p><img src="${url}" onload="document.getElementById('genBtn').disabled=false; document.getElementById('genBtn').innerText='Generate (1 Credit)'" onerror="alert('Failed da, try again')">`;
    
    localStorage.setItem(key, String(used+1));
    getCredits();
  }catch(e){
    alert(e.message);
    btn.disabled=false; btn.innerText="Generate (1 Credit)";
  }
};
</script>
</body>
</html>
