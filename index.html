<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI - ChatGPT Clone</title>
<link rel="icon" href="logo.png">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:10px;flex-shrink:0;overflow-y:auto}
.sb-logo{display:flex;gap:8px;align-items:center;padding:10px;font-weight:600}
.sb-logo img{width:22px;height:22px;border-radius:50%;border:1px solid #ff0040}
.sb-item{padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.sb-item:hover{background:#2f2f2f}
.sb-sec{margin-top:14px;padding:0 10px;font-size:11px;color:#888}
.sb-recent{padding:7px 10px;border-radius:8px;font-size:13px;color:#b4b4b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#000;height:100vh;height:100dvh;position:relative;z-index:1}
.topbar{height:56px;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222;flex-shrink:0}
.top-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;font-weight:600}
.top-center img{width:20px;height:20px;border-radius:50%;border:1px solid #ff0040}
.top-right{display:flex;gap:8px;align-items:center;position:relative}
.credit{font-size:11px;border:1px solid #333;padding:4px 8px;border-radius:20px;color:#aaa;background:#111}
.login{background:#fff;color:#000;padding:7px 16px;border-radius:20px;border:0;font-weight:600;cursor:pointer}
.avatar-img{width:28px;height:28px;border-radius:50%;border:1px solid #a855f7;object-fit:cover;display:none;flex-shrink:0}
.avatar-letter{width:28px;height:28px;border-radius:50%;background:#8a2eff;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;border:1px solid #a855f7;flex-shrink:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;text-align:center;padding:20px}
.chat{flex:1;overflow:auto;padding:20px;max-width:760px;width:100%;margin:0 auto;display:none}
.chat.show{display:block}
.msg{display:flex;gap:10px;margin:18px 0}
.bubble{font-size:15px;line-height:1.6;max-width:85%;white-space:pre-wrap;word-break:break-word}
.user-row{justify-content:flex-end}
.user-bub{background:#2f2f2f;padding:10px 14px;border-radius:18px;font-size:14px;max-width:80%}
.time{font-size:10px;color:#666;margin-top:5px;display:block}
.input-area{flex-shrink:0;padding:12px 10px;max-width:760px;width:100%;margin:0 auto;background:#000;border-top:1px solid #111;position:sticky;bottom:0;z-index:10}
.input-box{background:#303030;border-radius:28px;padding:6px 8px;display:flex;align-items:center;gap:8px;position:relative}
.plus{width:36px;height:36px;border-radius:50%;border:1px solid #555;display:grid;place-items:center;cursor:pointer;background:#303030;flex-shrink:0;font-size:20px}
.inp{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:16px;resize:none;min-height:24px;max-height:120px}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;border:0;display:grid;place-items:center;font-weight:800;cursor:pointer;flex-shrink:0}
.send:disabled{opacity:.5}
.tools{position:absolute;bottom:52px;left:0;background:#2a2a2a;border-radius:16px;padding:8px;width:280px;display:none;z-index:50;box-shadow:0 10px 30px #000c}
.tools.show{display:block}
.t-item{padding:10px;border-radius:10px;cursor:pointer}
.t-item:hover{background:#3a3a3a}
.topMenu{position:absolute;top:38px;right:0;width:240px;background:#2a2a2a;border-radius:14px;padding:6px;display:none;z-index:200;box-shadow:0 10px 30px #000c}
.topMenu.show{display:block}
.hamburger{font-size:20px;cursor:pointer}
.side-user{margin-top:auto;border-top:1px solid #222;padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer;flex-shrink:0;border-radius:8px}
.side-user:hover{background:#212121}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.overlay.show{display:block}
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;height:100%;height:100dvh;z-index:100;transform:translateX(-100%);transition:.25s;width:280px}.sidebar.open{transform:translateX(0)}.overlay.show{display:block}}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
<div class="sb-logo"><img src="logo.png"> Scarlet AI</div>
<div class="sb-item" onclick="newChat()">✎ New chat</div>
<div class="sb-sec">Recents</div>
<div id="history"></div>
<div class="side-user" id="sideUser" style="display:none">
<img id="sideAv" class="avatar-img" referrerpolicy="no-referrer">
<div id="sideAvLetter" class="avatar-letter" style="display:none">M</div>
<div><div id="sideName">Moco.</div><div style="font-size:11px;color:#777">Scarlet GPT</div></div>
</div>
</div>
<div class="main">
<div class="topbar">
<div style="display:flex;gap:10px;align-items:center"><span class="hamburger" onclick="toggleSidebar()">☰</span><span>Chat</span></div>
<div class="top-center"><img src="logo.png"> Scarlet AI</div>
<div class="top-right">
<span id="credit" class="credit">ChatGPT • No Limit</span>
<button class="login" id="loginBtn">Log in</button>
<div id="topUserWrap" style="display:none;position:relative;align-items:center">
<img id="topAvImg" class="avatar-img" referrerpolicy="no-referrer">
<div id="topAvLetter" class="avatar-letter">M</div>
<div id="topMenu" class="topMenu">
<div style="padding:10px;border-bottom:1px solid #333;display:flex;gap:10px;align-items:center">
<img id="menuAvImg" class="avatar-img" style="width:32px;height:32px;display:none" referrerpolicy="no-referrer">
<div id="menuAvLetter" class="avatar-letter" style="width:32px;height:32px">M</div>
<div><div id="topName">User</div><small style="color:#888">Scarlet GPT</small></div>
</div>
<div style="padding:10px;cursor:pointer" onclick="doLogout()">🚪 Log out</div>
</div>
</div>
</div>
</div>
<div class="center" id="centerBox">
<div style="font-size:32px;font-weight:700">Scarlet AI</div>
<div style="color:#888">ChatGPT Clone - No 30 sec limit • Tamil • Hindi • English</div>
<div style="font-size:12px;color:#555;margin-top:8px">Gmail avatar fixed ✅ Real ChatGPT backend ✅</div>
</div>
<div class="chat" id="chat"></div>
<div class="input-area">
<div class="input-box" id="inputBox">
<div class="plus" id="plusBtn">+</div>
<textarea class="inp" id="inp" placeholder="Ask anything..." rows="1"></textarea>
<button class="send" id="sendBtn">↑</button>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="tools" id="tools">
<div class="t-item" onclick="fileInput.click();tools.classList.remove('show')">📎 Add photos & files</div>
<div class="t-item" onclick="alert('ChatGPT mode only - No Pollinations')">💬 ChatGPT Mode</div>
</div>
</div>
</div>
</div>
<script>
var currentUid='guest';var chats=[];var chatHistory=[];
var chatEl=document.getElementById('chat');var centerBox=document.getElementById('centerBox');var inp=document.getElementById('inp');var historyEl=document.getElementById('history');var plusBtn=document.getElementById('plusBtn');var tools=document.getElementById('tools');var fileInput=document.getElementById('fileInput');
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function newChat(){centerBox.style.display='flex';chatEl.classList.remove('show');chatEl.innerHTML='';chatHistory=[];}
function showChat(){centerBox.style.display='none';chatEl.classList.add('show');}
function getTime(){var d=new Date();return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function addMsg(role,text,img,replyTime){
  showChat();
  var time=getTime();
  var d=document.createElement('div');d.className='msg'+(role==='user'?' user-row':'');
  if(role==='user'){var ex=img?'<br><img src="'+img+'" style="max-width:200px;border-radius:10px;margin-top:6px">':'';d.innerHTML='<div style="display:flex;flex-direction:column;align-items:flex-end"><div class="user-bub">'+text+ex+'</div><span class="time time-right">'+time+'</span></div>';}
  else{var rt=replyTime?' • ⚡ '+replyTime+'s':'';var ex2=img?'<br><img src="'+img+'" style="max-width:100%;border-radius:10px;margin-top:8px">':'';d.innerHTML='<img src="logo.png" class="avatar-img" style="display:grid;width:24px;height:24px"><div style="display:flex;flex-direction:column"><div class="bubble">'+text+ex2+'</div><span class="time">'+time+rt+'</span></div>';}
  chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;
}
function getChatKey(){return 'scarlet_chats_'+currentUid;}
function saveChats(){localStorage.setItem(getChatKey(),JSON.stringify(chats));renderHistory();}
function renderHistory(){historyEl.innerHTML='';var rev=chats.slice().reverse();for(var i=0;i<rev.length;i++){var div=document.createElement('div');div.className='sb-recent';div.innerText=rev[i].title;historyEl.appendChild(div);}}
function loadChats(){try{chats=JSON.parse(localStorage.getItem(getChatKey())||'[]');}catch(e){chats=[]}renderHistory();}

var firebaseConfig={apiKey:"AIzaSyAJagbPj-jtLCYeTE-PDOWc9tuhXCl6PdE",authDomain:"scarlet-ai-fa68c.firebaseapp.com",projectId:"scarlet-ai-fa68c",storageBucket:"scarlet-ai-fa68c.firebasestorage.app",messagingSenderId:"145131745721",appId:"1:145131745721:web:dfa412973efb2f37c3c668"};
firebase.initializeApp(firebaseConfig);var auth=firebase.auth();
document.getElementById('loginBtn').onclick=function(){var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p).catch(function(e){alert(e.message);});};
function doLogout(){auth.signOut().then(function(){location.reload();});}
auth.onAuthStateChanged(function(u){
  var sideUserEl=document.getElementById('sideUser');
  var sideAv=document.getElementById('sideAv');var sideAvLetter=document.getElementById('sideAvLetter');
  var topAvImg=document.getElementById('topAvImg');var topAvLetter=document.getElementById('topAvLetter');
  var menuAvImg=document.getElementById('menuAvImg');var menuAvLetter=document.getElementById('menuAvLetter');
  if(u){
    currentUid=u.uid;document.getElementById('loginBtn').style.display='none';document.getElementById('topUserWrap').style.display='flex';
    var letter=(u.displayName||u.email||'M')[0].toUpperCase();var photo=u.photoURL||'';
    if(photo){topAvImg.src=photo;menuAvImg.src=photo;sideAv.src=photo;topAvImg.style.display='block';menuAvImg.style.display='block';sideAv.style.display='block';topAvLetter.style.display='none';menuAvLetter.style.display='none';sideAvLetter.style.display='none';
      topAvImg.onerror=function(){this.style.display='none';topAvLetter.innerText=letter;topAvLetter.style.display='grid';};
      sideAv.onerror=function(){this.style.display='none';sideAvLetter.innerText=letter;sideAvLetter.style.display='grid';};
      menuAvImg.onerror=function(){this.style.display='none';menuAvLetter.innerText=letter;menuAvLetter.style.display='grid';};
    }else{topAvImg.style.display='none';menuAvImg.style.display='none';sideAv.style.display='none';topAvLetter.innerText=letter;sideAvLetter.innerText=letter;menuAvLetter.innerText=letter;topAvLetter.style.display='grid';sideAvLetter.style.display='grid';menuAvLetter.style.display='grid';}
    document.getElementById('sideName').innerText=u.displayName||u.email.split('@')[0];document.getElementById('topName').innerText=u.displayName||u.email;sideUserEl.style.display='flex';
  }else{currentUid='guest';document.getElementById('loginBtn').style.display='block';document.getElementById('topUserWrap').style.display='none';sideUserEl.style.display='none';}
  loadChats();
});

plusBtn.onclick=function(e){e.stopPropagation();tools.classList.toggle('show');};
document.getElementById('topAvImg').onclick=document.getElementById('topAvLetter').onclick=function(e){e.stopPropagation();document.getElementById('topMenu').classList.toggle('show');};
document.getElementById('sideUser').onclick=function(){if(auth.currentUser)doLogout();};
document.addEventListener('click',function(e){if(!e.target.closest('#inputBox'))tools.classList.remove('show');if(!e.target.closest('#topUserWrap'))document.getElementById('topMenu').classList.remove('show');});
fileInput.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){addMsg('user',f.name,ev.target.result);};r.readAsDataURL(f);};

// REAL CHATGPT CLONE - NO POLLINATIONS - USES /api/chat
async function send(){
  var q=inp.value.trim();if(!q)return;
  var start=Date.now();
  addMsg('user',q);inp.value='';inp.style.height='auto';tools.classList.remove('show');
  chatHistory.push({role:'user',content:q});

  var id='ai_'+Date.now();
  addMsg('ai','<span id="'+id+'">⚡ Thinking...</span>');
  var el=document.getElementById(id);
  var btn=document.getElementById('sendBtn');
  btn.disabled=true;

  try{
    var res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:q, history:chatHistory.slice(-6)})
    });
    var data=await res.json();
    if(!res.ok) throw new Error(data.error||'Server error');

    var diff=((Date.now()-start)/1000).toFixed(1);
    var msgEl=el?el.closest('.msg'):null;
    if(msgEl) msgEl.remove(); else if(chatEl.lastChild) chatEl.lastChild.remove();

    addMsg('ai',data.reply,null,diff);
    chatHistory.push({role:'assistant',content:data.reply});
    chats.push({title:q.slice(0,30)});saveChats();

  }catch(e){
    var msgEl2=el?el.closest('.msg'):null;
    if(msgEl2) msgEl2.remove();
    addMsg('ai','⚠️ Error: '+e.message+'\n\nVercel la OPENAI_API_KEY env var set panniya check pannu da.');
  }finally{
    btn.disabled=false;
  }
}
document.getElementById('sendBtn').onclick=send;
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
loadChats();
</script>
</body>
</html>
