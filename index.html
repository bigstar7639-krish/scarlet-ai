<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo-img{width:40px;height:40px;border-radius:50%;border:2px solid #ff0040}
.login-btn{background:#fff;color:#000;border:0;padding:8px 18px;border-radius:20px;font-weight:800;cursor:pointer}
.credit{font-size:12px;color:#aaa;border:1px solid #333;padding:5px 10px;border-radius:20px}
.main{max-width:700px;margin:0 auto;padding:16px}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:18px;margin-top:18px}
textarea{width:100%;background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;color:#fff;outline:none;resize:none;font-size:15px}
.gen-btn{width:100%;margin-top:12px;background:linear-gradient(135deg,#ff0040,#ff6a00);border:0;padding:14px;border-radius:12px;color:#fff;font-weight:800;cursor:pointer;font-size:16px}
#result img{width:100%;border-radius:12px;margin-top:14px}
#g_id_onload{position:fixed;top:70px;right:10px;z-index:100}
</style>
</head>
<body>
<header>
<div class="logo"><img src="logo.png" onerror="this.style.display='none'" class="logo-img"> Scarlet AI</div>
<div style="display:flex;gap:10px;align-items:center">
<div class="credit" id="credit">6/6</div>
<button class="login-btn" id="loginBtn">Login</button>
<span id="userInfo" style="display:none"></span>
</div>
</header>
<div id="g_id_onload"></div>
<div class="main">
<div class="card">
<h3>✨ Create Image</h3>
<textarea id="prompt" rows="4" placeholder="A cyberpunk girl in neon city, ultra detailed..."></textarea>
<button class="gen-btn" id="genBtn">Generate (1 Credit)</button>
<div id="result"></div>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAJagbPj-jtLCYeTE-PDOWc9tuhXCl6PdE",
  authDomain: "scarlet-ai-fa68c.firebaseapp.com",
  projectId: "scarlet-ai-fa68c",
  storageBucket: "scarlet-ai-fa68c.firebasestorage.app",
  messagingSenderId: "145131745721",
  appId: "1:145131745721:web:dfa412973efb2f37c3c668"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const loginBtn = document.getElementById('loginBtn');
const userInfo = document.getElementById('userInfo');
const GOOGLE_CLIENT_ID = "145131745721-gu1u800lif4elinkbb09s06aktel90fr.apps.googleusercontent.com";

function handleCredentialResponse(response){
  const idToken = response.credential;
  const credential = firebase.auth.GoogleAuthProvider.credential(idToken);
  loginBtn.innerText = "Logging in...";
  auth.signInWithCredential(credential).then((result)=>{
    console.log("SUCCESS HARI!", result.user.email);
  }).catch((e)=>{
    alert("Login failed: "+e.message);
    loginBtn.innerText = "Login";
    console.error(e);
  });
}

function initGSI(){
  if(!window.google || !window.google.accounts) {
    setTimeout(initGSI, 300);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: false,
    cancel_on_tap_outside: false
  });
  // Pre-load One Tap
  google.accounts.id.prompt();
}

window.addEventListener('load', initGSI);

loginBtn.onclick = ()=>{
  if(!window.google || !window.google.accounts){
    alert("Google loading da... 2 sec aprom click pannu");
    return;
  }
  google.accounts.id.prompt((notification)=>{
    console.log("Prompt status", notification);
    if(notification.isNotDisplayed()){
      alert("Popup blocked da! Chrome la 'Allow popups' pannu, aprom refresh panni try pannu da!");
    }
  });
};

auth.onAuthStateChanged((user)=>{
  if(user){
    loginBtn.style.display='none';
    userInfo.style.display='flex';
    userInfo.style.alignItems='center';
    userInfo.innerHTML = `<span>👤 ${user.displayName ? user.displayName.split(' ')[0] : (user.email ? user.email.split('@')[0] : 'User')}</span><button onclick="firebase.auth().signOut().then(()=>location.reload())" style="margin-left:8px;padding:5px 12px;border-radius:12px;background:#222;color:#fff;border:1px solid #444;cursor:pointer">Logout</button>`;
  }else{
    loginBtn.style.display='block';
    userInfo.style.display='none';
    loginBtn.innerText="Login";
  }
});

function getCredits(){
  const k='img_use_'+new Date().toDateString();
  let u=parseInt(localStorage.getItem(k)||"0"); if(isNaN(u)) u=0;
  document.getElementById('credit').innerText=`${6-u}/6`;
  return {u,k};
}
getCredits();
document.getElementById('genBtn').onclick=()=>{
  const p=document.getElementById('prompt').value.trim();
  if(!p) return alert("Prompt type pannu da!");
  let {u,k}=getCredits(); if(u>=6) return alert("Daily 6 over da! Tomorrow va!");
  const b=document.getElementById('genBtn'); b.disabled=true; b.innerText="Generating... 🔥";
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?seed=${Math.floor(Math.random()*99999)}&nologo=true&width=768&height=768`;
  const r=document.getElementById('result');
  const img=new Image(); img.src=url;
  img.onload=()=>{ r.innerHTML=''; r.appendChild(img); b.disabled=false; b.innerText='Generate (1 Credit)'; localStorage.setItem(k,String(u+1)); getCredits(); };
  img.onerror=()=>{ b.disabled=false; b.innerText='Generate (1 Credit)'; alert("Failed, try again da"); };
};
</script>
</body>
</html>
