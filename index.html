<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI</title>
<link rel="icon" href="logo.png">
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#ececec;font-family:Inter,system-ui;height:100vh;height:100dvh;display:flex;flex-direction:column}
#header{height:64px;background:#121212;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
#header .left{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}
#header .left img{width:32px;height:32px;border-radius:50%}
#header .right{display:flex;gap:16px;align-items:center;color:#8e8e8e}
#wrap{flex:1;display:flex;overflow:hidden}
#sidebar{width:260px;background:#111;border-right:1px solid #222;padding:16px;display:flex;flex-direction:column;gap:4px}
.sb-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:14px;color:#c7c7c7}
.sb-item.active{background:#1e1e1e;color:#fff}
.sb-item:hover{background:#1a1a1a}
.sb-item svg{width:18px;height:18px}
#user{margin-top:auto;background:#1a1a1a;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#logo{width:120px;height:120px;margin-bottom:16px}
#logo img{width:100%;height:100%;object-fit:contain}
#title{font-size:42px;font-weight:700;margin-bottom:8px}
#subtitle{color:#8e8e8e;margin-bottom:28px}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:700px;width:100%;margin-bottom:30px}
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px}
.card:hover{background:#252525}
.card svg{width:20px;height:20px;flex-shrink:0}
#inputWrap{width:100%;max-width:760px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:28px;padding:10px 12px;display:flex;align-items:center;gap:10px}
#inp{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px}
#send{width:38px;height:38px;border-radius:50%;background:#ff0033;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
#chat{width:100%;max-width:760px;display:none;flex-direction:column;gap:16px;margin-bottom:20px}
.msg{max-width:85%;padding:14px 16px;border-radius:18px;line-height:1.6;font-size:14px;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#2a2a2a}.msg.ai{align-self:flex-start;background:#121212;border:1px solid #2a2a2a}
</style>
</head>
<body>
<div id="header">
<div class="left"><img src="logo.png"> Scarlet AI</div>
<div class="right"><span>◐</span><span>⚙</span><span style="width:32px;height:32px;background:#333;border-radius:50%;display:inline-block"></span></div>
</div>
<div id="wrap">
<div id="sidebar">
<div class="sb-item active"><svg viewBox="0 0 24 24" fill="none" stroke="#ff0033" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> New chat</div>
<div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Images</div>
<div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Library</div>
<div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Scheduled</div>
<div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg> Plugins</div>
<div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Projects</div>
<div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 16.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg> Codex</div>
<div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg> More</div>
<div id="user"><img src="logo.png" style="width:32px;height:32px;border-radius:50%"> <div><b style="font-size:13px">You</b></div></div>
</div>
<div id="main">
<div id="logo"><img src="logo.png"></div>
<div id="title">Scarlet AI</div>
<div id="subtitle">How can I help you today?</div>
<div id="cards">
<div class="card" onclick="quick('Brainstorm product ideas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2A7.5 7.5 0 0 0 2 9.5c0 5.4 7.5 11.5S17 14.9 17 9.5A7.5 7.5 0 0 0 9.5 2z"/></svg> Brainstorm product ideas</div>
<div class="card" onclick="quick('Write and debug code')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg> Write and debug code</div>
<div class="card" onclick="quick('Generate an image of')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Generate an image</div>
<div class="card" onclick="quick('Summarize research paper')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Summarize research paper</div>
</div>
<div id="chat"></div>
<div id="inputWrap"><button style="width:36px;height:36px;border-radius:50%;background:#2a2a2a;border:none;color:#fff">+</button><input id="inp" placeholder="Ask anything"><button id="send" onclick="sendMsg()">↑</button></div>
</div>
</div>
<script>
let messages=[];
function quick(t){document.getElementById('inp').value=t+' ';document.getElementById('inp').focus()}
function addUser(t){let d=document.createElement('div');d.className='msg user';d.textContent=t;document.getElementById('chat').appendChild(d);document.getElementById('chat').style.display='flex';document.getElementById('logo').style.display='none';document.getElementById('title').style.display='none';document.getElementById('subtitle').style.display='none';document.getElementById('cards').style.display='none'}
function addAI(t){let d=document.createElement('div');d.className='msg ai';d.textContent=t;document.getElementById('chat').appendChild(d);return d}
async function sendMsg(){let q=document.getElementById('inp').value.trim();if(!q)return;addUser(q);document.getElementById('inp').value='';messages.push({role:'user',content:q});let th=addAI('Thinking...');try{let r=await puter.ai.chat(messages,{model:'gpt-4o-mini'});th.remove();addAI(r.message.content);messages.push({role:'assistant',content:r.message.content})}catch(e){th.textContent='Error: '+e.message}}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()})
</script>
</body>
</html>
