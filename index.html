<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scarlet AI</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#212121;color:#fff;display:flex;height:100vh;overflow:hidden}#main{flex:1;display:flex;flex-direction:column}#header{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333}#chat{flex:1;overflow-y:auto;padding:16px;max-width:800px;margin:0 auto;width:100%}.msg{margin:12px 0;display:flex;gap:10px}.msg.user{justify-content:flex-end}.bubble{padding:12px 16px;border-radius:18px;max-width:78%;white-space:pre-wrap;line-height:1.5}.user.bubble{background:#2f2f2f}.ai.bubble{background:#171717}#inputRow{display:flex;gap:8px;background:#2f2f2f;border-radius:26px;padding:8px 12px;max-width:800px;margin:12px auto;width:95%}#inp{flex:1;background:transparent;border:none;color:#fff;outline:none;resize:none;font-size:15px}#sendBtn{width:36px;height:36px;border-radius:50%;border:none;background:#fff;cursor:pointer}#keyBox{position:fixed;top:0;left:0;right:0;bottom:0;background:#000000ee;display:flex;align-items:center;justify-content:center;z-index:999}#keyBox.hide{display:none}.keyCard{background:#2f2f2f;padding:24px;border-radius:16px;width:90%;max-width:400px}.keyCard input{width:100%;padding:12px;border-radius:8px;border:none;margin:12px 0;background:#171717;color:#fff}.keyCard button{width:100%;padding:12px;background:#fff;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer}</style>
</head>
<body>
<div id="keyBox"><div class="keyCard"><h3>🔑 Enter OpenAI Key</h3><p style="font-size:13px;color:#aaa;margin-top:8px">Key local-a mattum save aagum, GitHub ku pogaathu. One time only.</p><input id="keyInp" type="password" placeholder="sk-proj-..."><button onclick="saveKey()">Save & Start Chat</button><p style="font-size:12px;margin-top:10px">OpenAI > API Keys la puthu key eduthu podu</p></div></div>
<div id="main"><div id="header"><h2>Scarlet AI</h2></div><div id="chat"></div><div id="inputRow"><textarea id="inp" rows="1" placeholder="Message Scarlet..."></textarea><button id="sendBtn" onclick="send()">↑</button></div></div>
<script>
let chatHistory=[];
const chatEl=document.getElementById('chat');
const inpEl=document.getElementById('inp');
const keyBox=document.getElementById('keyBox');
let apiKey=localStorage.getItem('scarlet_key')||'';
if(apiKey){keyBox.classList.add('hide');}
function saveKey(){let k=document.getElementById('keyInp').value.trim();if(!k||!k.startsWith('sk-')){alert('Valid key podu');return;}localStorage.setItem('scarlet_key',k);apiKey=k;keyBox.classList.add('hide');addMsg('ai','✅ Key saved! Hi sollu da!');}
function addMsg(role,text){let d=document.createElement('div');d.className='msg '+role;d.innerHTML=`<div class="bubble">${text}</div>`;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
async function send(){let q=inpEl.value.trim();if(!q)return;if(!apiKey){keyBox.classList.remove('hide');return;}addMsg('user',q);chatHistory.push({role:'user',content:q});inpEl.value='';let id=Date.now();addMsg('ai','<span id="'+id+'">⚡ Thinking...</span>');let btn=document.getElementById('sendBtn');btn.disabled=true;
try{let res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:'You are Scarlet AI by Krish, friendly ChatGPT clone.'},...chatHistory.slice(-10)]})});let data=await res.json();if(!res.ok) throw new Error(data.error?.message);document.getElementById(id).parentElement.parentElement.remove();addMsg('ai',data.choices[0].message.content);chatHistory.push({role:'assistant',content:data.choices[0].message.content});}catch(e){document.getElementById(id).parentElement.parentElement.remove();addMsg('ai','❌ '+e.message+' - Key thappa iruntha localStorage clear pannu: localStorage.removeItem(\"scarlet_key\")');}btn.disabled=false;}
inpEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
