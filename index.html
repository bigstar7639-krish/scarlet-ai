<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI - No API</title>
<link rel="icon" href="logo.png">
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:10px}
.sb-logo{display:flex;gap:8px;align-items:center;padding:10px;font-weight:700}
.sb-logo img{width:22px;height:22px;border-radius:50%;border:1px solid #ff0040}
.sb-item{padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer;background:#2f2f2f;margin-top:8px;text-align:center}
.main{flex:1;display:flex;flex-direction:column;background:#000}
.top{height:52px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-size:14px}
.user{align-self:flex-end;background:#2f2f2f}
.ai{align-self:flex-start;background:#171717;border:1px solid #222}
.bottom{padding:12px;border-top:1px solid #222;display:flex;gap:8px;align-items:center;background:#000}
#inp{flex:1;padding:13px 18px;border-radius:24px;border:none;background:#1f1f1f;color:#fff;outline:none;font-size:15px}
#send{width:42px;height:42px;border-radius:50%;border:none;background:#fff;color:#000;font-weight:bold;cursor:pointer;font-size:18px}
#send:disabled{opacity:0.5}
</style>
</head>
<body>

<div class="sidebar">
<div class="sb-logo"><img src="logo.png" onerror="this.style.display='none'"><span>Scarlet AI</span></div>
<div class="sb-item" onclick="newChat()">+ New Chat</div>
<div style="margin-top:auto;padding:10px;font-size:11px;color:#555;text-align:center">No API Key Needed<br>100% Free • Unlimited</div>
</div>

<div class="main">
<div class="top"><span style="font-weight:700">Scarlet AI ✨ FREE</span><div style="width:28px;height:28px;background:#a855f7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold">M</div></div>
<div class="chat" id="chat"></div>
<div class="bottom"><input id="inp" placeholder="Ask anything da..."><button id="send" onclick="sendMsg()">↑</button></div>
</div>

<script>
let history = [];
const chatEl = document.getElementById('chat');

function newChat(){history=[];chatEl.innerHTML='';addAI('New chat da Krish! 🔥 Ippo API key ye illa, full free! Kelu da!');}
function addUser(t){let d=document.createElement('div');d.className='msg user';d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
function addAI(t){let d=document.createElement('div');d.className='msg ai';d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}

async function sendMsg(){
 let q = document.getElementById('inp').value.trim();
 if(!q) return;
 addUser(q);
 history.push(q);
 document.getElementById('inp').value='';
 let thinking = addAI('⚡ Scarlet thinking...');
 document.getElementById('send').disabled=true;

 try{
  // METHOD 1: Puter.js - 100% free, no key, GPT-4o / Claude free
  let response = await puter.ai.chat(q, {model: "claude-3-5-sonnet", stream: false});
  // response will be string
  let reply = typeof response === 'string'? response : (response.message?.content?.[0]?.text || response.toString());

  thinking.remove();
  addAI(reply);
  document.getElementById('send').disabled=false;

 }catch(e){
  console.log("Puter failed, trying Pollinations backup...", e);
  try{
   // METHOD 2: Backup - Pollinations (no key)
   let res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(q));
   let txt = await res.text();
   thinking.remove();
   addAI(txt);
   document.getElementById('send').disabled=false;
  }catch(e2){
   thinking.textContent = '❌ Error da: ' + e.message + ' - Refresh pannu da';
   document.getElementById('send').disabled=false;
  }
 }
}
document.getElementById('inp').addEventListener('keydown', e=>{if(e.key==='Enter') sendMsg();});
addAI('Vanakkam da Krish! 😎\n\nIppo NO API KEY da!\n✓ Free\n✓ Unlimited\n✓ No setup\n\nEdhuvum kekkalam da, Tamil-la kooda! Enna vishayam?');
</script>
</body>
</html>
