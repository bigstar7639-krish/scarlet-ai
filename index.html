<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scarlet AI - OEV-1</title><link rel="icon" href="logo.png"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column}.top{height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid #1e1e1e;font-weight:700}.avatar{width:24px;height:24px;border-radius:50%;border:1px solid #ff0040}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.chat{flex:1;overflow:auto;padding:20px;max-width:760px;width:100%;margin:0 auto;display:none}.chat.on{display:block}.msg{display:flex;gap:10px;margin:16px 0}.bub{font-size:14.5px;line-height:1.6;white-space:pre-wrap}.user{justify-content:flex-end}.user.bub{background:#2f2f2f;padding:10px 16px;border-radius:18px;max-width:75%}.imgW{width:100%;border-radius:14px;overflow:hidden;max-height:500px;background:#111;margin-top:8px}.imgW img{width:100%;display:block}.box{padding:10px 12px;max-width:760px;width:100%;margin:0 auto}.input{background:#303030;border-radius:28px;padding:6px 8px;display:flex;gap:8px;align-items:flex-end}.plus{width:36px;height:36px;border-radius:50%;border:1px solid #555;display:grid;place-items:center;cursor:pointer}.inp{flex:1;background:0;border:0;color:#fff;outline:none;font-size:16px;resize:none;max-height:120px;min-height:24px;padding:8px 0}.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;border:0;display:grid;place-items:center;font-weight:800}.tools{position:absolute;bottom:65px;left:10px;background:#222;border:1px solid #333;border-radius:14px;padding:6px;display:none;width:280px}.tools.show{display:block}.t{display:flex;gap:10px;padding:10px;border-radius:8px;cursor:pointer}.t:hover{background:#333}.mbar{display:flex;gap:6px}.m{padding:6px 12px;border-radius:20px;background:#1e1e1e;border:1px solid #2a2a2a;font-size:12px;cursor:pointer;color:#999}.m.on{background:#fff;color:#000}</style></head><body>
<div class="top"><img src="logo.png" class="avatar"> Scarlet AI - OEV-1 - 4 in 1</div>
<div class="center" id="center"><div style="font-size:28px;font-weight:700">Ready when you are.</div><div class="mbar"><div class="m on" data-m="auto">Auto</div><div class="m" data-m="chat">Chat ⚡</div><div class="m" data-m="image">Image 🎨</div></div><div style="font-size:11px;color:#666">ChatGPT + Gemini + Meta + Groq - All in One</div></div>
<div class="chat" id="chat"></div>
<div class="box" style="position:relative"><div class="input" id="inputBox"><div class="plus" id="plus">+</div><textarea class="inp" id="inp" placeholder="Ask anything or type /image white hair girl..." rows="1"></textarea><button class="send" id="send">↑</button><div class="tools" id="tools"><div class="t" data-a="photo"><div>📎</div><div><div style="font-size:13px">Add photo - Gemini maathiri analyze</div><div style="font-size:11px;color:#888">Photo upload pannu</div></div></div><div class="t" data-a="image"><div>🎨</div><div><div style="font-size:13px">Create image - ChatGPT maathiri</div><div style="font-size:11px;color:#888">Text to photo</div></div></div></div></div><div style="text-align:center;font-size:10px;color:#555;margin-top:6px">Scarlet AI - ChatGPT • Gemini • Meta • Groq - OEV-1</div></div>
<input type="file" id="file" accept="image/*" style="display:none">
<script>
let mode='auto';document.querySelectorAll('.m').forEach(m=>{m.onclick=()=>{document.querySelectorAll('.m').forEach(x=>x.classList.remove('on'));m.classList.add('on');mode=m.dataset.m;};});
const plus=document.getElementById('plus'),tools=document.getElementById('tools'),file=document.getElementById('file'),inp=document.getElementById('inp'),chat=document.getElementById('chat'),center=document.getElementById('center');
plus.onclick=e=>{e.stopPropagation();tools.classList.toggle('show');};document.addEventListener('click',e=>{if(!e.target.closest('#inputBox'))tools.classList.remove('show');});
function showChat(){center.style.display='none';chat.classList.add('on');}
function addMsg(role,text,img){showChat();const d=document.createElement('div');d.className='msg'+(role==='user'?' user':'');if(role==='user'){d.innerHTML=`<div class="bub" style="background:#2f2f2f;padding:10px 16px;border-radius:18px">${text}${img?`<br><img src="${img}" style="max-width:180px;border-radius:10px;margin-top:6px">`:''}</div>`;}else{let im=img?`<div class="imgW"><img src="${img}"></div><div style="margin-top:6px"><a href="${img}" target="_blank" style="color:#6ab7ff;font-size:12px">⬇️ Download clean</a></div>`:'';d.innerHTML=`<img class="avatar" src="logo.png"><div class="bub">${text}${im}</div>`;}chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function isImg(q){const l=q.toLowerCase();return mode==='image'||l.startsWith('/image')||l.includes('create image')||l.includes('generate image')||l.includes('draw')||l.startsWith('image of')||l.startsWith('photo of');}
function cleanP(q){return q.replace(/^\/image\s*/i,'').replace(/^create an? image of\s*/i,'').replace(/^generate an? image of\s*/i,'').replace(/^image of\s*/i,'').trim()||q;}
document.querySelectorAll('.t').forEach(el=>{el.onclick=()=>{tools.classList.remove('show');const a=el.dataset.a;if(a==='photo')file.click();if(a==='image'){mode='image';document.querySelectorAll('.m').forEach(x=>x.classList.remove('on'));document.querySelector('[data-m="image"]').classList.add('on');inp.placeholder='Describe image - ex: white hair girl in cyberpunk city';inp.focus();}};});
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const b64=ev.target.result;addMsg('user',`Analyze this: ${f.name}`,b64);sendVision(b64);};r.readAsDataURL(f);};
async function sendVision(b64){const d=document.createElement('div');d.className='msg';d.innerHTML=`<img class="avatar" src="logo.png"><div class="bub" id="vs"><span style="color:#888">Gemini maathiri analyzing photo...</span></div>`;chat.appendChild(d);try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:"Describe this image in detail", image:b64})});const reader=res.body.getReader();const dec=new TextDecoder();let txt="";while(true){const {done,value}=await reader.read();if(done)break;const chunk=dec.decode(value);chunk.split('\n').forEach(line=>{if(line.startsWith('data: ')){const data=line.replace('data: ','').trim();if(data&&data!=='[DONE]'){txt+=data;document.getElementById('vs').innerText=txt;chat.scrollTop=chat.scrollHeight;}}});}document.getElementById('vs').removeAttribute('id');}catch(e){document.getElementById('vs').innerText="Vision error da! Groq key check pannu!";}}
async function send(){const q=inp.value.trim();if(!q)return;addMsg('user',q);inp.value='';inp.style.height='auto';if(isImg(q)){const prompt=cleanP(q);const d=document.createElement('div');d.className='msg';d.innerHTML=`<img class="avatar" src="logo.png"><div class="bub"><span style="color:#888">ChatGPT maathiri prompt enhance panni image create panren... "${prompt}"</span></div>`;chat.appendChild(d);try{const res=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const data=await res.json();d.remove();addMsg('ai',`✨ "${data.original}"\n🎯 Enhanced: "${data.enhanced}"`,data.url);}catch(e){d.remove();addMsg('ai','Image fail da! /api/image file irukka paaru!');}return;}const d=document.createElement('div');d.className='msg';d.innerHTML=`<img class="avatar" src="logo.png"><div class="bub" id="st"><span style="color:#888">OEV-1 Fast (Groq) thinking...</span></div>`;chat.appendChild(d);const el=document.getElementById('st');el.innerHTML="";let full="";try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});if(!res.ok)throw new Error();const reader=res.body.getReader();const dec=new TextDecoder();while(true){const {done,value}=await reader.read();if(done)break;const chunk=dec.decode(value);chunk.split('\n').forEach(line=>{if(line.startsWith('data: ')){const data=line.replace('data: ','').trim();if(data==='[DONE]')return;if(data){full+=data;el.innerText=full;chat.scrollTop=chat.scrollHeight;}}});}el.removeAttribute('id');}catch{el.innerText="Groq key error da! Vercel la GROQ_API_KEY set panniya?";}}
document.getElementById('send').onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
</script></body></html>
