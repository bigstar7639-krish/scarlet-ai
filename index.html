<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI</title>
<link rel="icon" href="logo.png">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:10px}
.sb-logo{display:flex;gap:8px;align-items:center;padding:10px;font-weight:600}
.sb-logo img{width:22px;height:22px;border-radius:50%;border:1px solid #ff0040}
.sb-item{padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.sb-item:hover{background:#2f2f2f}
.sb-sec{margin-top:14px;padding:0 10px;font-size:11px;color:#888}
.sb-recent{padding:7px 10px;border-radius:8px;font-size:13px;color:#b4b4b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#000;position:relative;z-index:1}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222}
.top-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;font-weight:600}
.top-center img{width:20px;height:20px;border-radius:50%;border:1px solid #ff0040}
.top-right{display:flex;gap:8px;align-items:center;position:relative}
.credit{font-size:11px;border:1px solid #333;padding:4px 8px;border-radius:20px;color:#aaa}
.login{background:#fff;color:#000;padding:7px 16px;border-radius:20px;border:0;font-weight:600;cursor:pointer}
.avatar-sm{width:28px;height:28px;border-radius:50%;border:1px solid #ff0040;cursor:pointer;object-fit:cover}
.center{flex:1;display:flex;align-items:center;justify-content:center;font-size:24px}
.chat{flex:1;overflow:auto;padding:20px;max-width:760px;width:100%;margin:0 auto;display:none}
.chat.show{display:block}
.msg{display:flex;gap:10px;margin:16px 0}
.bubble{font-size:15px;line-height:1.5;max-width:85%;white-space:pre-wrap;word-break:break-word}
.user-row{justify-content:flex-end}
.user-bub{background:#2f2f2f;padding:10px 14px;border-radius:18px;font-size:14px}
.input-area{padding:10px;max-width:760px;width:100%;margin:0 auto}
.input-box{background:#303030;border-radius:28px;padding:6px 8px;display:flex;align-items:center;gap:8px;position:relative}
.plus{width:36px;height:36px;border-radius:50%;border:1px solid #555;display:grid;place-items:center;cursor:pointer;background:#303030;flex-shrink:0}
.inp{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:16px;resize:none}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;border:0;display:grid;place-items:center;font-weight:800;cursor:pointer;flex-shrink:0}
.tools{position:absolute;bottom:50px;left:0;background:#2a2a2a;border-radius:16px;padding:8px;width:280px;display:none;z-index:20}
.tools.show{display:block}
.t-item{padding:10px;border-radius:10px;cursor:pointer}
.t-item:hover{background:#3a3a3a}
.topMenu{position:absolute;top:38px;right:0;width:200px;background:#2a2a2a;border-radius:14px;padding:6px;display:none;z-index:200}
.topMenu.show{display:block}
.hamburger{display:none;font-size:20px;cursor:pointer}
.side-user{margin-top:auto;border-top:1px solid #222;padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.overlay.show{display:block}
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;height:100%;z-index:100;transform:translateX(-100%);transition:.25s;width:280px}.sidebar.open{transform:translateX(0)}.hamburger{display:block}.overlay{display:none}.overlay.show{display:block}}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
<div class="sb-logo"><img src="logo.png"> Scarlet AI</div>
<div class="sb-item" onclick="newChat()">✎ New chat</div>
<div class="sb-item">🖼️ Images</div>
<div class="sb-sec">Recents</div>
<div id="history"></div>
<div class="side-user" id="sideUser" style="display:none"><img id="sideAv" src="logo.png" class="avatar-sm"><div><div id="sideName">Moco.</div><div style="font-size:11px;color:#777">Free • Scarlet</div></div></div>
</div>
<div class="main">
<div class="topbar">
<div style="display:flex;gap:10px;align-items:center"><span class="hamburger" onclick="toggleSidebar()">☰</span><span>Chat</span></div>
<div class="top-center"><img src="logo.png"> Scarlet AI</div>
<div class="top-right"><span id="credit" class="credit">6/6</span><button class="login" id="loginBtn">Log in</button><div id="topUserWrap" style="display:none;position:relative"><img id="topAv" src="logo.png" class="avatar-sm"><div id="topMenu" class="topMenu"><div style="padding:10px;border-bottom:1px solid #333"><div id="topName">Moco.</div></div><div style="padding:10px;cursor:pointer" onclick="doLogout()">🚪 Log out</div></div></div></div>
</div>
<div class="center" id="centerBox">Ready when you are.</div>
<div class="chat" id="chat"></div>
<div class="input-area">
<div class="input-box" id="inputBox">
<div class="plus" id="plusBtn">+</div>
<textarea class="inp" id="inp" placeholder="Ask anything - Tamil, Hindi, English..." rows="1"></textarea>
<button class="send" id="sendBtn">↑</button>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="tools" id="tools">
<div class="t-item" onclick="fileInput.click();tools.classList.remove('show')">📎 Add photos & files</div>
<div class="t-item" onclick="setMode('image')">🎨 Create image</div>
<div class="t-item" onclick="setMode('chat')">💬 Chat (All Languages)</div>
</div>
</div>
</div>
</div>
<script>
var currentUid='guest';
var chats=[];
var mode='chat';
var chatEl=document.getElementById('chat');
var centerBox=document.getElementById('centerBox');
var inp=document.getElementById('inp');
var historyEl=document.getElementById('history');
var plusBtn=document.getElementById('plusBtn');
var tools=document.getElementById('tools');
var fileInput=document.getElementById('fileInput');

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function newChat(){
  centerBox.style.display='flex';
  chatEl.classList.remove('show');
  chatEl.innerHTML='';
}
function showChat(){
  centerBox.style.display='none';
  chatEl.classList.add('show');
}
function addMsg(role,text,img){
  showChat();
  var d=document.createElement('div');
  d.className='msg'+(role==='user'?' user-row':'');
  if(role==='user'){
    var extra=img?'<br><img src="'+img+'" style="max-width:200px;border-radius:10px;margin-top:6px">':'';
    d.innerHTML='<div class="user-bub">'+text+extra+'</div>';
  }else{
    var extra2=img?'<br><img src="'+img+'" style="max-width:100%;border-radius:10px;margin-top:8px">':'';
    d.innerHTML='<img src="logo.png" class="avatar-sm"><div class="bubble">'+text+extra2+'</div>';
  }
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}
function getChatKey(){return 'scarlet_chats_'+currentUid;}
function getCreditKey(){return 'img_use_'+new Date().toDateString()+'_'+currentUid;}
function saveChats(){localStorage.setItem(getChatKey(),JSON.stringify(chats));renderHistory();}
function renderHistory(){historyEl.innerHTML='';var rev=chats.slice().reverse();for(var i=0;i<rev.length;i++){var c=rev[i];var d=document.createElement('div');d.className='sb-recent';d.innerText=c.title;historyEl.appendChild(d);}}
function loadChats(){try{chats=JSON.parse(localStorage.getItem(getChatKey())||'[]');}catch(e){chats=[]}renderHistory();newChat();}
function getCredits(){var k=getCreditKey();var u=parseInt(localStorage.getItem(k)||'0');if(isNaN(u))u=0;document.getElementById('credit').innerText=(6-u)+'/6';return {u:u,k:k};}
function setMode(m){mode=m;tools.classList.remove('show');if(m==='image'){addMsg('ai','Image mode ON 🎨 - Describe pannu da Moco!');}else{addMsg('ai','Chat mode ON - Tamil, Hindi, English ellam pesanum 💬');}inp.focus();}

var firebaseConfig={apiKey:"AIzaSyAJagbPj-jtLCYeTE-PDOWc9tuhXCl6PdE",authDomain:"scarlet-ai-fa68c.firebaseapp.com",projectId:"scarlet-ai-fa68c",storageBucket:"scarlet-ai-fa68c.firebasestorage.app",messagingSenderId:"145131745721",appId:"1:145131745721:web:dfa412973efb2f37c3c668"};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth();

document.getElementById('loginBtn').onclick=function(){
  var provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(provider).catch(function(e){alert('Login error: '+e.message);});
};
function doLogout(){
  auth.signOut().then(function(){location.reload();});
}
auth.onAuthStateChanged(function(u){
  var sideUserEl=document.getElementById('sideUser');
  if(u){
    currentUid=u.uid;
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('topUserWrap').style.display='block';
    document.getElementById('topAv').src=u.photoURL||'logo.png';
    document.getElementById('sideAv').src=u.photoURL||'logo.png';
    document.getElementById('sideName').innerText=u.displayName||'Moco.';
    document.getElementById('topName').innerText=u.displayName||'Moco.';
    sideUserEl.style.display='flex';
  }else{
    currentUid='guest';
    document.getElementById('loginBtn').style.display='block';
    document.getElementById('topUserWrap').style.display='none';
    sideUserEl.style.display='none';
  }
  loadChats();
  getCredits();
});

plusBtn.onclick=function(e){e.stopPropagation();tools.classList.toggle('show');};
document.getElementById('topAv').onclick=function(e){e.stopPropagation();document.getElementById('topMenu').classList.toggle('show');};
document.getElementById('sideUser').onclick=function(){if(auth.currentUser)doLogout();};
document.addEventListener('click',function(e){if(!e.target.closest('#inputBox')){tools.classList.remove('show');}if(!e.target.closest('#topUserWrap')){document.getElementById('topMenu').classList.remove('show');}});
fileInput.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){addMsg('user',f.name,ev.target.result);};r.readAsDataURL(f);};

async function send(){
  var q=inp.value.trim();if(!q)return;
  addMsg('user',q);inp.value='';tools.classList.remove('show');
  var isImg=(mode==='image')||q.toLowerCase().indexOf('create image')!==-1;
  if(isImg){
    var cred=getCredits();if(cred.u>=6){addMsg('ai','Daily 6 over da Moco ❤️');return;}
    var prompt=q.replace(/create image/gi,'').trim()||q;
    addMsg('ai','Generating "'+prompt+'"...');
    var url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?seed='+Math.floor(Math.random()*99999)+'&nologo=true&width=768&height=768';
    var img=new Image();img.src=url;
    img.onload=function(){try{chatEl.lastChild.remove();}catch(e){}addMsg('ai',prompt,url);localStorage.setItem(cred.k,String(cred.u+1));getCredits();chats.push({title:prompt.slice(0,30)});saveChats();mode='chat';};
    img.onerror=function(){try{chatEl.lastChild.remove();}catch(e){}addMsg('ai','Image fail, try again da');};
    return;
  }
  var id='ai_'+Date.now();
  addMsg('ai','<span id="'+id+'">⚡ Typing...</span>');
  var el=document.getElementById(id);
  var fastPrompt='Reply in SAME language as user (Tamil,Hindi,Telugu,Malayalam,Kannada,Bengali,English,Tanglish,Hinglish). Be friendly, short. User: '+q;
  try{
    var res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(fastPrompt)+'?model=openai&seed='+Date.now());
    var txt=await res.text();
    el.parentElement.innerText=txt;
    chats.push({title:q.slice(0,30)});saveChats();
  }catch(e){
    el.parentElement.innerText='Network slow da, again try pannu';
  }
}
document.getElementById('sendBtn').onclick=send;
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
loadChats();
getCredits();
</script>
</body>
</html>
