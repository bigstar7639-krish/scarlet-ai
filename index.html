<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scarlet AI</title>
<link rel="icon" href="logo.png">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:10px;flex-shrink:0;overflow:auto}
.sb-logo{display:flex;gap:8px;align-items:center;padding:10px;font-weight:600}
.sb-logo img{width:22px;height:22px;border-radius:50%;border:1px solid #ff0040;object-fit:cover}
.sb-item{padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer;color:#ececec}
.sb-item:hover{background:#2f2f2f}
.sb-sec{margin-top:14px;padding:0 10px;font-size:11px;color:#888}
.sb-recent{padding:7px 10px;border-radius:8px;font-size:13px;color:#b4b4b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sb-recent:hover{background:#212121;color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#000}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222;flex-shrink:0}
.top-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;font-weight:600;font-size:14px}
.top-center img{width:20px;height:20px;border-radius:50%;border:1px solid #ff0040}
.top-right{display:flex;gap:8px;align-items:center;position:relative}
.credit{font-size:11px;border:1px solid #333;padding:4px 8px;border-radius:20px;color:#aaa}
.login{background:#fff;color:#000;padding:7px 16px;border-radius:20px;border:0;font-weight:600}
.avatar-sm{width:28px;height:28px;border-radius:50%;border:1px solid #ff0040;cursor:pointer;object-fit:cover}
.center{flex:1;display:flex;align-items:center;justify-content:center;font-size:22px}
.chat{flex:1;overflow:auto;padding:20px;max-width:760px;width:100%;margin:0 auto;display:none;flex-direction:column;gap:12px}
.chat.show{display:flex}
.msg{display:flex;gap:10px}
.bubble{font-size:15px;line-height:1.5;max-width:85%;white-space:pre-wrap;word-break:break-word}
.user-row{justify-content:flex-end}
.user-bub{background:#2f2f2f;padding:10px 14px;border-radius:18px;font-size:14px}
.input-area{padding:10px;max-width:760px;width:100%;margin:0 auto}
.input-box{background:#303030;border-radius:28px;padding:6px;display:flex;align-items:center;gap:8px;position:relative}
.plus{width:36px;height:36px;border-radius:50%;border:1px solid #555;display:grid;place-items:center;cursor:pointer;background:#303030}
.inp{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:16px;resize:none;max-height:100px}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;border:0;display:grid;place-items:center;font-weight:800;cursor:pointer}
.tools{position:absolute;bottom:55px;left:0;background:#2a2a2a;border-radius:16px;padding:8px;width:300px;display:none;z-index:20}
.tools.show{display:block}
.t-item{padding:10px;border-radius:10px;cursor:pointer;display:flex;gap:10px}
.t-item:hover{background:#3a3a3a}
.topMenu{position:absolute;top:38px;right:0;width:200px;background:#2a2a2a;border-radius:14px;padding:6px;display:none;z-index:50}
.topMenu.show{display:block}
.hamburger{display:none}
@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;height:100%;z-index:50;transform:translateX(-100%);transition:.25s;width:280px}.sidebar.open{transform:translateX(0)}.hamburger{display:block}}
.overlay{position:fixed;inset:0;background:#0008;z-index:40;display:none}.overlay.show{display:block}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
<div class="sb-logo"><img src="logo.png"> Scarlet AI <span style="margin-left:auto;font-size:10px;background:#222;padding:3px 6px;border-radius:6px">v1.5</span></div>
<div class="sb-item" onclick="newChat()">✎ New chat</div>
<div class="sb-item">🖼️ Images</div>
<div class="sb-item">🕒 Scheduled</div>
<div class="sb-item">📚 Library</div>
<div class="sb-sec">Recents</div>
<div id="history"></div>
<div style="margin-top:auto;border-top:1px solid #222;padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer" onclick="if(auth.currentUser) doLogout()"><img id="sideAv" src="logo.png" class="avatar-sm"><div><div id="sideName" style="font-size:13px">Moco.</div><div style="font-size:11px;color:#777">Free • Scarlet</div></div></div>
</div>
<div class="main">
<div class="topbar">
<div style="display:flex;gap:10px;align-items:center"><span class="hamburger" onclick="toggleSidebar()">☰</span><span>Chat</span></div>
<div class="top-center"><img src="logo.png"> Scarlet AI</div>
<div class="top-right"><span id="credit" class="credit">6/6</span><button class="login" id="loginBtn">Log in</button><div id="topUserWrap" style="display:none;position:relative"><img id="topAv" src="logo.png" class="avatar-sm"><div id="topMenu" class="topMenu"><div style="padding:10px;border-bottom:1px solid #333"><div id="topName">Moco.</div><small style="color:#888">Free</small></div><div style="padding:10px;cursor:pointer" onclick="doLogout()">🚪 Log out</div></div></div></div>
</div>
<div class="center" id="centerBox">Ready when you are.</div>
<div class="chat" id="chat"></div>
<div class="input-area">
<div class="input-box" id="inputBox">
<div class="plus" id="plusBtn">+</div>
<textarea class="inp" id="inp" placeholder="Ask anything" rows="1"></textarea>
<button class="send" id="sendBtn">↑</button>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="tools" id="tools">
<div class="t-item" onclick="triggerFile()"><span>📎</span> Add photos & files</div>
<div class="t-item" onclick="setMode('image')"><span>🎨</span> Create image</div>
<div class="t-item" onclick="setMode('web')"><span>🌐</span> Web search</div>
<div class="t-item" onclick="setMode('think')"><span>🧠</span> Thinking</div>
</div>
</div>
</div>
</div>
<script>
let currentUid='guest';
function getKey(){return 'scarlet_chats_'+currentUid;}
let chats=[];
let mode='chat';
const chatEl=document.getElementById('chat'),centerBox=document.getElementById('centerBox'),inp=document.getElementById('inp'),historyEl=document.getElementById('history');
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function newChat(){centerBox.style.display='flex';chatEl.classList.remove('show');chatEl.innerHTML='';}
function showChat(){centerBox.style.display='none';chatEl.classList.add('show');}
function addMsg(role,text,img){showChat();let d=document.createElement('div');d.className='msg'+(role==='user'?' user-row':'');if(role==='user'){d.innerHTML=`<div class="user-bub">${text}${img?`<br><img src="${img}" style="max-width:200px;border-radius:10px;margin-top:6px">`:''}</div>`;}else{d.innerHTML=`<img src="logo.png" class="avatar-sm"><div class="bubble">${text}${img?`<br><img src="${img}" style="max-width:100%;border-radius:10px;margin-top:8px">`:''}</div>`;}chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
function saveChats(){localStorage.setItem(getKey(),JSON.stringify(chats));renderHistory();}
function renderHistory(){historyEl.innerHTML='';chats.slice().reverse().forEach(c=>{let d=document.createElement('div');d.className='sb-recent';d.innerText=c.title;historyEl.appendChild(d);});}
function loadChats(){try{chats=JSON.parse(localStorage.getItem(getKey())||'[]');}catch{chats=[]}renderHistory();newChat();}
function setMode(m){mode=m;document.getElementById('tools').classList.remove('show');addMsg('ai',m+' mode ON');inp.focus();}
function triggerFile(){document.getElementById('fileInput').click();document.getElementById('tools').classList.remove('show');}
function getCredits(){let k='img_use_'+new Date().toDateString();let u=parseInt(localStorage.getItem(k)||'0');if(isNaN(u))u=0;document.getElementById('credit').innerText=`${6-u}/6`;return {u,k};}
// Firebase
const firebaseConfig={apiKey:"AIzaSyAJagbPj-jtLCYeTE-PDOWc9tuhXCl6PdE",authDomain:"scarlet-ai-fa68c.firebaseapp.com",projectId:"scarlet-ai-fa68c",storageBucket:"scarlet-ai-fa68c.firebasestorage.app",messagingSenderId:"145131745721",appId:"1:145131745721:web:dfa412973efb2f37c3c668"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const auth=firebase.auth();
const GOOGLE_CLIENT_ID="145131745721-gu1u800lif4elinkbb09s06aktel90fr.apps.googleusercontent.com";
function handleCred(r){let c=firebase.auth.GoogleAuthProvider.credential(r.credential);auth.signInWithCredential(c);}
function initGSI(){if(!window.google||!google.accounts){setTimeout(initGSI,500);return;}google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleCred});}
initGSI();
document.getElementById('loginBtn').onclick=()=>{try{google.accounts.id.prompt();}catch{alert('Login loading... wait 2 sec and try again');}};
function doLogout(){if(confirm('Log out?')) auth.signOut().then(()=>location.reload());}
auth.onAuthStateChanged(u=>{
  if(u){currentUid=u.uid;document.getElementById('loginBtn').style.display='none';document.getElementById('topUserWrap').style.display='block';document.getElementById('topAv').src=u.photoURL||'logo.png';document.getElementById('sideAv').src=u.photoURL||'logo.png';document.getElementById('sideName').innerText=u.displayName||'Moco.';document.getElementById('topName').innerText=u.displayName||'Moco.';}
  else{currentUid='guest';document.getElementById('loginBtn').style.display='block';document.getElementById('topUserWrap').style.display='none';document.getElementById('sideAv').src='logo.png';document.getElementById('sideName').innerText='Moco.';}
  loadChats();getCredits();
});
// UI Events
document.getElementById('plusBtn').onclick=(e)=>{e.stopPropagation();document.getElementById('tools').classList.toggle('show');};
document.getElementById('topAv').onclick=(e)=>{e.stopPropagation();document.getElementById('topMenu').classList.toggle('show');};
document.addEventListener('click',e=>{if(!e.target.closest('#inputBox'))document.getElementById('tools').classList.remove('show');if(!e.target.closest('#topUserWrap'))document.getElementById('topMenu').classList.remove('show');});
document.getElementById('fileInput').onchange=e=>{
 let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{addMsg('user',f.name,ev.target.result);};r.readAsDataURL(f);
};
async function send(){
 let q=inp.value.trim();if(!q)return;addMsg('user',q);inp.value='';document.getElementById('tools').classList.remove('show');
 if(mode==='image'||q.toLowerCase().includes('create image')){
  let {u,k}=getCredits();if(u>=6){addMsg('ai','Daily 6 over da');return;}let prompt=q.replace('create image','').trim()||q;
  addMsg('ai','Generating '+prompt+'...');let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${Math.floor(Math.random()*99999)}&nologo=true&width=768&height=768`;
  let img=new Image();img.src=url;img.onload=()=>{chatEl.lastChild.remove();addMsg('ai',prompt,url);localStorage.setItem(k,String(u+1));getCredits();chats.push({title:prompt.slice(0,30)});saveChats();mode='chat';};img.onerror=()=>{chatEl.lastChild.remove();addMsg('ai','Failed retry');};
 }else{
  addMsg('ai','Thinking...');try{let res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(q)}?model=openai`);let txt=await res.text();chatEl.lastChild.querySelector('.bubble').innerText=txt;chats.push({title:q.slice(0,30)});saveChats();}catch{chatEl.lastChild.querySelector('.bubble').innerText='Error';}
 }
}
document.getElementById('sendBtn').onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});
loadChats();getCredits();
</script>
</body>
</html>
