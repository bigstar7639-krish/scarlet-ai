<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI</title>
<link rel="icon" href="logo.png">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:10px;flex-shrink:0;transition:0.3s}
.sidebar.hide{margin-left:-260px}
.sb-logo{display:flex;gap:8px;align-items:center;padding:10px;font-weight:600}
.sb-logo img{width:22px;height:22px;border-radius:50%;border:1px solid #ff0040}
.sb-item{padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer;margin-top:4px}
.sb-item:hover{background:#2f2f2f}
.main{flex:1;display:flex;flex-direction:column;background:#000;position:relative}
.top{height:52px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#2f2f2f}
.ai{align-self:flex-start;background:#171717;border:1px solid #222;display:flex;gap:8px}
.ai img{width:24px;height:24px;border-radius:50%;flex-shrink:0}
.bottom{padding:12px;border-top:1px solid #222;display:flex;gap:8px;align-items:center;position:sticky;bottom:0;background:#000}
#inp{flex:1;padding:13px 18px;border-radius:24px;border:none;background:#1f1f1f;color:#fff;outline:none;font-size:15px}
#send{width:40px;height:40px;border-radius:50%;border:none;background:#fff;color:#000;font-weight:bold;cursor:pointer}
#keyBox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#keyBox.hide{display:none}
.card{background:#222;padding:20px;border-radius:16px;width:100%;max-width:360px;text-align:center}
.card input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#111;color:#fff}
.card button{width:100%;padding:12px;border-radius:8px;border:none;background:#fff;color:#000;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div id="keyBox"><div class="card"><h3>✨ Scarlet AI Setup</h3><p style="font-size:12px;color:#888;margin:8px 0">aistudio.google.com/app/apikey - Gemini FREE Key</p><input id="keyInput" placeholder="AIza..."><button onclick="saveKey()">Save & Start</button></div></div>

<div class="sidebar" id="side">
<div class="sb-logo"><img src="logo.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"><span>Scarlet AI</span></div>
<div class="sb-item" onclick="newChat()">+ New Chat</div>
<div style="margin-top:auto;padding:10px"><button onclick="clearKey()" style="background:#222;color:#888;border:none;padding:8px 12px;border-radius:8px;width:100%;font-size:12px">Change API Key</button></div>
</div>

<div class="main">
<div class="top">
<div style="display:flex;align-items:center;gap:10px"><span style="cursor:pointer;font-size:20px" onclick="toggleSide()">☰</span><span>Chat</span></div>
<div style="display:flex;align-items:center;gap:10px"><img src="logo.png" style="width:24px;height:24px;border-radius:50%" onerror="this.style.display='none'"><b>Scarlet AI</b><span id="cnt" style="background:#222;padding:4px 10px;border-radius:12px;font-size:12px">0/0</span></div>
<div style="width:28px;height:28px;background:#a855f7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold">M</div>
</div>
<div class="chat" id="chat"></div>
<div class="bottom">
<input id="inp" placeholder="Ask anything - Tamil, English..."><button id="send" onclick="sendMsg()">↑</button>
</div>
</div>

<script>
// === CONFIG - 100% BUG FREE ===
let API_KEY = localStorage.getItem('scarlet_gemini_final') || '';
let history = [];
const chatEl = document.getElementById('chat');
const keyBox = document.getElementById('keyBox');
const cntEl = document.getElementById('cnt');

if(API_KEY) keyBox.classList.add('hide');

function saveKey(){
 let k = document.getElementById('keyInput').value.trim();
 if(!k.startsWith('AIza')){alert('Valid Gemini Key (AIza...) podu da');return;}
 localStorage.setItem('scarlet_gemini_final', k);
 location.reload();
}
function clearKey(){localStorage.clear();location.reload();}
function toggleSide(){document.getElementById('side').classList.toggle('hide');}
function newChat(){history=[];chatEl.innerHTML='';updateCnt();addAI('New chat started da Krish! 🔥');}

function updateCnt(){cntEl.textContent = history.length + '/' + history.length;}

function addUser(t){
 let d=document.createElement('div');d.className='msg user';d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;
}
function addAI(t){
 let wrap=document.createElement('div');wrap.className='msg ai';
 let img=document.createElement('img');img.src='logo.png';img.onerror=()=>img.style.display='none';
 let txt=document.createElement('span');txt.textContent=t;
 wrap.appendChild(img);wrap.appendChild(txt);
 chatEl.appendChild(wrap);chatEl.scrollTop=chatEl.scrollHeight;return wrap;
}

async function sendMsg(){
 let q = document.getElementById('inp').value.trim();
 if(!q) return;
 if(!API_KEY){keyBox.classList.remove('hide');return;}

 addUser(q);
 history.push({role:'user', parts:[{text:q}]});
 document.getElementById('inp').value='';
 updateCnt();

 let thinking = addAI('⚡ Thinking...');

 try{
  // FINAL WORKING MODEL - NO SEED, NO EXTRA PARAMS
  const MODEL = "gemini-2.5-flash";
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

  const res = await fetch(url, {
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify({
    contents: history
    // NO generationConfig, NO seed - ithu thaan bug fix!
   })
  });

  const data = await res.json();
  console.log(data);
  if(data.error) throw new Error(data.error.message);

  const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No reply';
  thinking.remove();
  addAI(reply);
  history.push({role:'model', parts:[{text:reply}]});
  updateCnt();

 }catch(e){
  thinking.querySelector('span').textContent = '❌ Error: ' + e.message + '\n\nIf key error, click Change API Key';
  console.error(e);
 }
}

document.getElementById('inp').addEventListener('keydown', e=>{if(e.key==='Enter') sendMsg();});

// First message
addAI('Vanakkam da Krish! 😎 Naan Scarlet AI - FINAL bug-free version! Ippo kekka ready da!');
</script>
</body>
</html>
