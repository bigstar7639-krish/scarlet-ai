<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scarlet AI</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#212121;color:#ececec;height:100vh;display:flex;flex-direction:column}#top{padding:12px 20px;border-bottom:1px solid #333;display:flex;justify-content:space-between}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:85%;padding:12px 16px;border-radius:18px;white-space:pre-wrap;line-height:1.5}.user{align-self:flex-end;background:#2f2f2f}.ai{align-self:flex-start;background:#171717;border:1px solid #333}#bottom{padding:12px;border-top:1px solid #333;display:flex;gap:8px}#inp{flex:1;padding:12px 16px;border-radius:24px;border:none;background:#2f2f2f;color:#fff;outline:none}#send{width:42px;height:42px;border-radius:50%;border:none;background:#fff;cursor:pointer;font-weight:bold}#keyScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}#keyScreen.hide{display:none}.card{background:#2f2f2f;padding:22px;border-radius:16px;width:100%;max-width:380px;text-align:center}.card input{width:100%;padding:12px;margin:12px 0;border-radius:8px;border:none;background:#171717;color:#fff}.card button{width:100%;padding:12px;border-radius:8px;border:none;background:#fff;color:#000;font-weight:700}</style></head><body>
<div id="keyScreen"><div class="card"><h3>✨ Scarlet AI - FIXED</h3><p style="font-size:12px;color:#aaa">Gemini Key (AIza...)</p><input id="keyInput" type="text" placeholder="AIza..."><button onclick="saveKey()">Save & Start</button></div></div>
<div id="top"><span>Scarlet AI ✨</span><button onclick="localStorage.clear();location.reload()" style="background:#333;color:#aaa;border:none;padding:6px 10px;border-radius:12px;font-size:12px">Change Key</button></div>
<div id="chat"><div class="msg ai">Vanakkam da Krish! Ippo final fixed! Hi sollu da!</div></div>
<div id="bottom"><input id="inp" placeholder="Message..."><button id="send" onclick="send()">↑</button></div>
<script>
let apiKey=localStorage.getItem('scarlet_final_v3')||'';let history=[];const ks=document.getElementById('keyScreen');if(apiKey)ks.classList.add('hide');
function saveKey(){let k=document.getElementById('keyInput').value.trim();localStorage.setItem('scarlet_final_v3',k);apiKey=k;ks.classList.add('hide');}
function addMsg(t,cls){let c=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+cls;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}
async function tryModel(model,q){
 let url=`https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=`+apiKey;
 let res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:history})});
 let data=await res.json();if(data.error)throw new Error(data.error.message);return data.candidates[0].content.parts[0].text;
}
async function send(){let q=document.getElementById('inp').value.trim();if(!q)return;addMsg(q,'user');history.push({role:'user',parts:[{text:q}]});document.getElementById('inp').value='';let th=addMsg('⚡ Thinking...','ai');
 const models=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.0-flash","gemini-3.6-flash","gemini-1.5-flash"];
 let ok=false;
 for(let m of models){
  try{let rep=await tryModel(m,q);th.remove();addMsg(rep,'ai');history.push({role:'model',parts:[{text:rep}]});ok=true;break;}catch(e){console.log(m+' failed: '+e.message);th.textContent='Trying '+m+'... '+e.message; continue;}
 }
 if(!ok){th.textContent='❌ All models failed. Check key & enable Generative Language API in Google Cloud.';}
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script></body></html>
