<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scarlet AI</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;height:100dvh;overflow:hidden;display:flex}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:10px;flex-shrink:0;overflow:hidden;transition:transform.25s;position:relative}
.sidebar.mob{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:20}
.sidebar.mob.open{transform:translateX(0)}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.sb-logo{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.new{width:100%;padding:10px;background:#212121;border:0;color:#fff;border-radius:10px;cursor:pointer;display:flex;gap:8px;margin:8px 0}
.mitem{padding:10px 8px;border-radius:8px;cursor:pointer;color:#ececec;font-size:14px;display:flex;gap:10px}
.mitem:hover{background:#212121}
.recent-title{color:#8a8a8a;font-size:13px;padding:14px 8px 6px}
.list{flex:1;overflow-y:auto}
.recent{padding:8px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:#c7c7c7}
.recent:hover,.recent.active{background:#212121;color:#fff}
.user{padding:10px 8px;border-top:1px solid #222;display:flex;gap:10px;align-items:center;cursor:pointer;margin-top:auto;position:relative}
.av{width:32px;height:32px;background:#ff0040;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.main{flex:1;display:flex;flex-direction:column;background:#212121;min-width:0;position:relative}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #2a2a2a}
.center{flex:1;display:flex;align-items:center;justify-content:center;font-size:22px;padding:20px;text-align:center}
.chat{flex:1;overflow:auto;padding:20px;max-width:800px;margin:0 auto;width:100%;display:none;flex-direction:column;gap:12px}
.bubble{padding:12px 16px;border-radius:18px;max-width:85%;word-break:break-word}
.bubble.user{background:#2f2f2f;align-self:flex-end;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start}
.bubble img{max-width:100%;border-radius:12px;margin-top:8px}
.inputWrap{padding:12px;display:flex;justify-content:center;background:#212121;position:relative}
.box{width:100%;max-width:760px;background:#303030;border-radius:28px;padding:8px 12px;display:flex;align-items:flex-end;gap:8px}
.box textarea{flex:1;background:transparent;border:0;color:#fff;outline:none;resize:none;min-height:24px;max-height:120px;font-size:16px;padding:8px 0}
.icon{width:36px;height:36px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon.plus{background:#3a3a3a;color:#fff}
.icon.send{background:#fff;color:#000}
.plusMenu{position:absolute;bottom:70px;left:12px;max-width:320px;width:90%;background:#2e2e2e;border-radius:20px;padding:6px;display:none;z-index:30}
.plusMenu.show{display:block}
.opt{padding:12px 14px;display:flex;gap:12px;cursor:pointer;border-radius:12px}
.opt:hover{background:#3a3a3a}
.userMenu{position:absolute;bottom:70px;left:10px;width:240px;background:#2a2a2a;border-radius:14px;padding:6px;display:none;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.userMenu.show{display:block}
#sketch{position:fixed;inset:0;background:#000;z-index:999;display:none;flex-direction:column}
#draw{flex:1;background:#111;touch-action:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none}
.overlay.show{display:block}
</style>
</head>
<body>
<div class="overlay" id="ov" onclick="toggleMob(false)"></div>
<div class="sidebar" id="side">
<div class="sb-head"><div class="sb-logo">Scarlet AI</div><span style="background:#2a2a2a;padding:2px 8px;border-radius:12px;font-size:12px">v1.5</span></div>
<button class="new" onclick="newChat()">✎ New chat</button>
<div class="mitem" onclick="openImages()">🖼️ Images</div>
<div class="mitem" onclick="openScheduled()">🕒 Scheduled</div>
<div class="mitem" onclick="openLibrary()">📚 Library</div>
<div class="recent-title">Recents</div>
<div class="list" id="recentList"></div>
<div class="user" id="userBtn" onclick="toggleUserMenu()"><div class="av">M</div><div><div>MocƆ</div><small style="color:#888">Free • Scarlet</small></div></div>
<div class="userMenu" id="userMenu">
<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid #333">MocƆ<br><small style="color:#888">Free • Scarlet</small></div>
<div class="opt" onclick="logout()">🚪 Log out</div>
<div class="opt" style="color:#ff6b6b" onclick="clearAll()">🗑️ Clear all chats</div>
</div>
</div>
<div class="main">
<div class="topbar"><div style="display:flex;gap:10px;align-items:center"><span onclick="toggleMob()" style="cursor:pointer;font-size:20px">☰</span><b>Scarlet AI</b></div><span style="background:#2a2a2a;padding:4px 8px;border-radius:12px;font-size:12px">1/6</span></div>
<div class="center" id="center">What's on your mind today?</div>
<div class="chat" id="chat"></div>
<div class="inputWrap">
<div class="plusMenu" id="plusMenu">
<div class="opt" onclick="openCamera()">📷 Camera</div>
<div class="opt" onclick="openPhotos()">🖼️ Photos</div>
<div class="opt" onclick="openFiles()">📎 Files</div>
<div class="opt" onclick="createImg()">🎨 Create image</div>
<div class="opt" onclick="openSketch()">✏️ Sketch</div>
<div class="opt" onclick="thinking()">💭 Thinking</div>
<div class="opt" onclick="webSearch()">🌐 Web search</div>
<div class="opt" onclick="deepResearch()">🔬 Deep research</div>
</div>
<div class="box">
<button class="icon plus" onclick="togglePlus()">+</button>
<textarea id="q" placeholder="Ask anything" rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
<button class="icon" onclick="voice()">🎤</button>
<button class="icon send" onclick="send()">↑</button>
</div>
</div>
</div>
<input type="file" id="pIn" accept="image/*" hidden onchange="onPhoto(this)">
<input type="file" id="fIn" hidden onchange="onFile(this)">
<div id="sketch"><div style="padding:10px;display:flex;gap:10px;background:#111"><button onclick="clearDraw()" style="padding:8px 12px;background:#222;color:#fff;border:0;border-radius:8px">Clear</button><button onclick="closeSketch()" style="padding:8px 12px;background:#ff0040;color:#fff;border:0;border-radius:8px">Save</button><input type="color" id="col" value="#ff0040"><input type="range" id="sz" min="1" max="20" value="4"></div><canvas id="draw"></canvas></div>
<script>
let chats=JSON.parse(localStorage.getItem('scarlet_chats')||'[]'),curId=null;
let chatEl=document.getElementById('chat'),centerEl=document.getElementById('center'),qEl=document.getElementById('q'),recentEl=document.getElementById('recentList');
function save(){localStorage.setItem('scarlet_chats',JSON.stringify(chats));renderRecents()}
function renderRecents(){recentEl.innerHTML='';chats.slice().reverse().forEach(c=>{let d=document.createElement('div');d.className='recent'+(c.id===curId?' active':'');d.textContent=c.title||'Hi';d.onclick=()=>loadChat(c.id);recentEl.appendChild(d)})}
function newChat(){curId=Date.now().toString();chats.push({id:curId,title:'Hi',msgs:[]});save();chatEl.innerHTML='';chatEl.style.display='none';centerEl.style.display='flex';toggleMob(false)}
function loadChat(id){curId=id;let c=chats.find(x=>x.id===id);chatEl.innerHTML='';c.msgs.forEach(m=>addBubble(m.role,m.html,false));chatEl.style.display='flex';centerEl.style.display='none';renderRecents();toggleMob(false)}
function addBubble(role,html,doSave=true){centerEl.style.display='none';chatEl.style.display='flex';let d=document.createElement('div');d.className='bubble '+(role==='user'?'user':'ai');d.innerHTML=html;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;if(doSave&&curId){let cc=chats.find(x=>x.id===curId);cc.msgs.push({role,html});if(cc.msgs.length===1)cc.title=html.replace(/<[^>]*>/g,'').slice(0,30);save()}}
function send(){let v=qEl.value.trim();if(!v){if(!curId)newChat();return}if(!curId)newChat();addBubble('user',v);qEl.value='';autoGrow(qEl);setTimeout(()=>addBubble('ai',v),300);document.getElementById('plusMenu').classList.remove('show')}
function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function toggleMob(f){let s=document.getElementById('side'),ov=document.getElementById('ov');if(window.innerWidth>768)return;if(f===false){s.classList.remove('open');ov.classList.remove('show');return}let o=s.classList.contains('open');if(o){s.classList.remove('open');ov.classList.remove('show')}else{s.classList.add('mob');s.classList.add('open');ov.classList.add('show')}}
if(window.innerWidth<=768)document.getElementById('side').classList.add('mob');
function togglePlus(){document.getElementById('plusMenu').classList.toggle('show');document.getElementById('userMenu').classList.remove('show')}
function toggleUserMenu(){let m=document.getElementById('userMenu');m.classList.toggle('show');document.getElementById('plusMenu').classList.remove('show')}
function logout(){if(confirm('Log out pannava?')){try{if(window.firebase&&firebase.auth)firebase.auth().signOut()}catch(e){}localStorage.removeItem('scarlet_chats');location.reload()}}
function clearAll(){if(confirm('All chats delete?')){localStorage.removeItem('scarlet_chats');location.reload()}}
function openImages(){let imgs=[];chats.forEach(c=>c.msgs.forEach(m=>{let mt=m.html.match(/<img src="[^"]+"/g);if(mt)imgs=imgs.concat(mt)}));if(!imgs.length)addBubble('ai','No images yet');else addBubble('ai','🖼️ Images:<br>'+imgs.map(i=>i+'>').join('<br>'))}
function openLibrary(){addBubble('ai','📚 Library: '+chats.length+' chats')}
function openScheduled(){let t=prompt('Seconds:');if(!t)return;let msg=prompt('Message:');if(!msg)return;addBubble('ai','🕒 Scheduled '+t+'s');setTimeout(()=>addBubble('ai','⏰ '+msg),parseInt(t)*1000)}
async function openCamera(){document.getElementById('plusMenu').classList.remove('show');try{let s=await navigator.mediaDevices.getUserMedia({video:true});let v=document.createElement('video');v.autoplay=true;v.srcObject=s;v.style.width='100%';let w=document.createElement('div');w.className='bubble ai';let b=document.createElement('button');b.textContent='Capture';b.style.cssText='padding:8px 14px;background:#ff0040;color:#fff;border:0;border-radius:8px;margin-top:8px';w.appendChild(v);w.appendChild(b);chatEl.appendChild(w);chatEl.style.display='flex';centerEl.style.display='none';b.onclick=()=>{let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let img=c.toDataURL();s.getTracks().forEach(x=>x.stop());w.remove();addBubble('user','<img src="'+img+'">')};}catch(e){addBubble('ai','Camera permission needed')}}
function openPhotos(){document.getElementById('pIn').click()}
function onPhoto(i){if(!i.files[0])return;let r=new FileReader();r.onload=e=>addBubble('user','<img src="'+e.target.result+'"><br>'+i.files[0].name);r.readAsDataURL(i.files[0])}
function openFiles(){document.getElementById('fIn').click()}
function onFile(i){if(!i.files[0])return;let f=i.files[0];let r=new FileReader();r.onload=e=>addBubble('user','📎 '+f.name+'<br><pre style="white-space:pre-wrap;background:#000;padding:8px;border-radius:8px;margin-top:6px">'+e.target.result.slice(0,2000)+'</pre>');if(f.type.startsWith('text')||f.name.endsWith('.json')||f.name.endsWith('.txt'))r.readAsText(f);else r.readAsDataURL(f)}
function createImg(){let p=prompt('Prompt:');if(!p)return;let c=document.createElement('canvas');c.width=512;c.height=512;let ctx=c.getContext('2d');let g=ctx.createLinearGradient(0,0,512,512);g.addColorStop(0,'#ff0040');g.addColorStop(1,'#ff8800');ctx.fillStyle=g;ctx.fillRect(0,0,512,512);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('SCARLET AI',256,200);ctx.font='18px sans-serif';let words=p.split(' '),line='',y=250;for(let n=0;n<words.length;n++){let t=line+words[n]+' ';if(ctx.measureText(t).width>400&&n>0){ctx.fillText(line,256,y);line=words[n]+' ';y+=24}else line=t}ctx.fillText(line,256,y);addBubble('user','<img src="'+c.toDataURL()+'"><br>'+p)}
let drawing=false,can,ctxd;
function openSketch(){document.getElementById('sketch').style.display='flex';can=document.getElementById('draw');ctxd=can.getContext('2d');can.width=innerWidth;can.height=innerHeight-50;ctxd.lineCap='round';can.onpointerdown=e=>{drawing=true;ctxd.beginPath();ctxd.moveTo(e.clientX,e.clientY-can.getBoundingClientRect().top)};can.onpointermove=e=>{if(!drawing)return;ctxd.strokeStyle=document.getElementById('col').value;ctxd.lineWidth=document.getElementById('sz').value;ctxd.lineTo(e.clientX,e.clientY-can.getBoundingClientRect().top);ctxd.stroke()};can.onpointerup=()=>drawing=false}
function clearDraw(){ctxd.clearRect(0,0,can.width,can.height)}
function closeSketch(){let img=can.toDataURL();document.getElementById('sketch').style.display='none';addBubble('user','<img src="'+img+'">')}
function thinking(){addBubble('ai','💭 Thinking...');setTimeout(()=>addBubble('ai','Done'),1000)}
async function webSearch(){let q=prompt('Search:');if(!q)return;addBubble('user','Search: '+q);try{let r=await fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json');let d=await r.json();addBubble('ai',d.AbstractText||'<a href="https://duckduckgo.com/?q='+encodeURIComponent(q)+'" target="_blank" style="color:#ff0040">Open '+q+'</a>')}catch(e){addBubble('ai','<a href="https://www.google.com/search?q='+encodeURIComponent(q)+'" target="_blank" style="color:#ff0040">Search '+q+'</a>')}}
function deepResearch(){let q=prompt('Topic:');if(!q)return;addBubble('user','Research: '+q);['Collecting','Analyzing','Checking','Report'].forEach((s,i)=>setTimeout(()=>addBubble('ai',s+': '+q),(i+1)*700))}
function voice(){let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){addBubble('ai','Voice not supported');return}let r=new Rec();r.lang='en-IN';r.start();r.onresult=e=>{qEl.value=e.results[0][0].transcript;autoGrow(qEl)}}
renderRecents();if(chats.length===0)newChat();else loadChat(chats[chats.length-1].id);
document.addEventListener('click',e=>{if(!e.target.closest('#plusMenu')&&!e.target.closest('.plus'))document.getElementById('plusMenu').classList.remove('show');if(!e.target.closest('#userMenu')&&!e.target.closest('#userBtn'))document.getElementById('userMenu').classList.remove('show')});
</script>
</body>
</html>
