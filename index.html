<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI - ChatGPT Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#212121;color:#fff;display:flex;height:100vh;overflow:hidden}
#sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:12px;transition:.3s}
#sidebar.hide{margin-left:-260px}
#main{flex:1;display:flex;flex-direction:column;background:#212121}
#header{padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2f2f2f}
#header h2{font-size:18px}
#chat{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%}
.msg{margin:14px 0;display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.msg-bubble{padding:12px 16px;border-radius:18px;max-width:75%;line-height:1.5;white-space:pre-wrap}
.msg.user.msg-bubble{background:#2f2f2f}
.msg.ai.msg-bubble{background:transparent}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
#inputArea{padding:12px 20px;display:flex;flex-direction:column;gap:8px;max-width:800px;margin:0 auto;width:100%}
#tools{display:none;gap:8px;padding:8px;background:#2f2f2f;border-radius:12px}
#tools.show{display:flex}
.tool{padding:6px 12px;background:#3a3a3a;border-radius:20px;font-size:13px;cursor:pointer}
#inputRow{display:flex;gap:10px;align-items:end;background:#2f2f2f;border-radius:26px;padding:8px 12px}
#inp{flex:1;background:transparent;border:none;color:#fff;outline:none;resize:none;max-height:120px;font-size:15px;padding:8px 0}
#sendBtn{width:36px;height:36px;border-radius:50%;border:none;background:#fff;color:#000;cursor:pointer;font-size:16px}
#sendBtn:disabled{opacity:.5}
.newChat{padding:10px;background:#fff;color:#000;border-radius:8px;text-align:center;cursor:pointer;font-weight:600;margin-bottom:12px}
.chatItem{padding:10px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:#aaa}
.chatItem:hover{background:#2f2f2f;color:#fff}
</style>
</head>
<body>
<div id="sidebar">
<div class="newChat" onclick="newChat()">+ New Chat</div>
<div id="chatList"></div>
</div>
<div id="main">
<div id="header">
<span style="cursor:pointer" onclick="toggleSide()">☰</span>
<h2>Scarlet AI</h2>
<div style="margin-left:auto" id="userAvatar"></div>
</div>
<div id="chat"></div>
<div id="inputArea">
<div id="tools">
<div class="tool" onclick="insertTool('Create image: ')">🎨 Image</div>
<div class="tool" onclick="insertTool('Search: ')">🔍 Search</div>
<div class="tool" onclick="insertTool('Code: ')">💻 Code</div>
</div>
<div id="inputRow">
<textarea id="inp" rows="1" placeholder="Message Scarlet AI..." oninput="autoGrow();showTools()" onkeydown="handleKey(event)"></textarea>
<button id="sendBtn" onclick="send()">↑</button>
</div>
</div>
</div>

<script>
// ===== CONFIG - NO KEY IN GITHUB - SECURE =====
let chats = JSON.parse(localStorage.getItem('scarlet_chats')||'[]');
let chatHistory = [];
let currentUser = null;

// ===== GMAIL AVATAR FIX =====
function loadUser(){
 try{
  // Try to get Google user from localStorage if you saved before
  const g = localStorage.getItem('google_user');
  if(g){
    currentUser = JSON.parse(g);
  }
  const av = document.getElementById('userAvatar');
  if(currentUser && currentUser.picture){
    av.innerHTML = `<img src="${currentUser.picture}" style="width:32px;height:32px;border-radius:50%">`;
  }else{
    av.innerHTML = `<div class="avatar">U</div>`;
  }
 }catch{}
}

function toggleSide(){ document.getElementById('sidebar').classList.toggle('hide'); }
function autoGrow(){ const i=document.getElementById('inp'); i.style.height='auto'; i.style.height=i.scrollHeight+'px'; }
function showTools(){ document.getElementById('tools').classList.add('show'); }
function insertTool(t){ const i=document.getElementById('inp'); i.value=t; i.focus(); }
function handleKey(e){ if(e.key==='Enter' &&!e.shiftKey){ e.preventDefault(); send(); } }

function addMsg(role,text,time){
 const chatEl=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='msg '+role;
 const bubble=`<div class="msg-bubble">${text}${time?`<div style="font-size:11px;opacity:.5;margin-top:6px">${time}s</div>`:''}</div>`;
 if(role==='user'){
   div.innerHTML=bubble+`<div class="avatar">U</div>`;
 }else{
   div.innerHTML=`<div class="avatar" style="background:#10a37f;color:#fff">S</div>`+bubble;
 }
 chatEl.appendChild(div);
 chatEl.scrollTop=chatEl.scrollHeight;
}

function newChat(){
 chatHistory=[]; document.getElementById('chat').innerHTML='';
 document.getElementById('chatList').innerHTML='';
 chats.forEach((c,i)=>{
  const d=document.createElement('div'); d.className='chatItem'; d.textContent=c.title;
  d.onclick=()=>{ loadChat(i); };
  document.getElementById('chatList').appendChild(d);
 });
}

function saveChats(){ localStorage.setItem('scarlet_chats',JSON.stringify(chats)); }

// ===== FINAL SECURE SEND - USES /api/chat.js BACKEND =====
async function send(){
  var q=document.getElementById('inp').value.trim();if(!q)return;
  var start=Date.now();
  addMsg('user',q);document.getElementById('inp').value='';document.getElementById('inp').style.height='auto';
  document.getElementById('tools').classList.remove('show');
  chatHistory.push({role:'user',content:q});

  var id='ai_'+Date.now();
  addMsg('ai','<span id="'+id+'">⚡ Thinking...</span>');
  var el=document.getElementById(id);
  var btn=document.getElementById('sendBtn');
  btn.disabled=true;

  try{
    var res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:[
          {role:'system',content:'You are Scarlet AI, a friendly ChatGPT clone by Krish. Answer helpfully in same language user uses (Tamil/English).'},
        ...chatHistory.slice(-10)
        ]
      })
    });
    var data=await res.json();
    if(!res.ok) throw new Error(data.error || 'Failed - Check Vercel Env Var');
    var diff=((Date.now()-start)/1000).toFixed(1);
    var msgEl=el?el.closest('.msg'):null;
    if(msgEl) msgEl.remove();
    var reply=data.choices[0].message.content;
    addMsg('ai',reply,null,diff);
    chatHistory.push({role:'assistant',content:reply});
    chats.unshift({title:q.slice(0,35)});if(chats.length>30)chats.pop();saveChats();newChat();
  }catch(e){
    var msgEl2=el?el.closest('.msg'):null;
    if(msgEl2) msgEl2.remove();
    addMsg('ai','❌ '+e.message+'\n\nCheck: Vercel → Settings → Environment Variables → OPENAI_API_KEY set panniya?');
  }
  btn.disabled=false;
}

function loadChat(i){ chatHistory=[]; document.getElementById('chat').innerHTML=''; addMsg('ai','Chat: '+chats[i].title); }
loadUser(); newChat();
</script>
</body>
</html>
